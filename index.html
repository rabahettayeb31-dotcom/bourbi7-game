<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 شكون أكثر واحد؟ - ULTRA</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050510;
  --card: #0d0d20;
  --card2: #12122a;
  --accent: #ff2d55;
  --cyan: #00f5ff;
  --gold: #ffd700;
  --purple: #b040ff;
  --green: #00ff87;
  --orange: #ff7c00;
  --glow-accent: 0 0 20px #ff2d5580, 0 0 40px #ff2d5540;
  --glow-cyan: 0 0 20px #00f5ff80, 0 0 40px #00f5ff40;
  --glow-gold: 0 0 20px #ffd70080, 0 0 40px #ffd90050;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow-x:hidden;}
body{
  background:var(--bg);
  font-family:'Tajawal',sans-serif;
  color:#fff;
  min-height:100vh;
}

/* ===== NOISE OVERLAY ===== */
body::before{
  content:'';
  position:fixed;top:0;left:0;width:100%;height:100%;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.4;
}

/* ===== ANIMATED GRID BG ===== */
body::after{
  content:'';
  position:fixed;top:0;left:0;width:100%;height:100%;
  background-image:
    linear-gradient(rgba(0,245,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,0.03) 1px,transparent 1px);
  background-size:40px 40px;
  animation:gridMove 20s linear infinite;
  pointer-events:none;z-index:0;
}
@keyframes gridMove{from{background-position:0 0}to{background-position:40px 40px}}

canvas#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}

#appRoot{
  position:relative;z-index:2;
  max-width:520px;width:100%;
  margin:0 auto;
  padding:1rem 0.8rem 5rem;
  min-height:100vh;
}

/* ===== HEADER ===== */
.top-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:0.5rem 0 1rem;
}
.logo{
  font-size:1.1rem;font-weight:900;
  background:linear-gradient(90deg,var(--accent),var(--purple),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:logoShimmer 3s linear infinite;
  background-size:200%;
}
@keyframes logoShimmer{0%{background-position:0%}100%{background-position:200%}}

/* ===== CARDS ===== */
.card{
  background:var(--card);
  border-radius:1.2rem;
  padding:1rem;
  margin-bottom:0.8rem;
  border:1px solid rgba(255,255,255,0.07);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.03) 0%,transparent 60%);
  pointer-events:none;
}
.card-glow-accent{border-color:var(--accent)40;box-shadow:var(--glow-accent);}
.card-glow-cyan{border-color:var(--cyan)40;box-shadow:var(--glow-cyan);}
.card-glow-gold{border-color:var(--gold)40;box-shadow:var(--glow-gold);}

/* ===== CHAMPION BANNER ===== */
.champ-banner{
  background:linear-gradient(135deg,#1a0020,#200010,#0a1a30);
  border:1px solid var(--gold)50;
  border-radius:1.5rem;
  padding:1rem;text-align:center;
  box-shadow:var(--glow-gold);
  position:relative;overflow:hidden;
  margin-bottom:1rem;
}
.champ-banner::before{
  content:'';position:absolute;top:-50%;left:-50%;
  width:200%;height:200%;
  background:conic-gradient(transparent 0deg,var(--gold)10 10deg,transparent 20deg);
  animation:champSpin 8s linear infinite;
  opacity:.15;
}
@keyframes champSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.champ-crown{font-size:2rem;animation:crownFloat 2s ease-in-out infinite;}
@keyframes crownFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.champ-name{font-size:1.4rem;font-weight:900;color:var(--gold);}
.champ-score{font-size:0.9rem;color:#aaa;}

/* ===== CATEGORY BUTTONS ===== */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;margin-bottom:1rem;}
.cat-btn{
  background:var(--card2);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:1rem;padding:0.7rem 0.3rem;
  cursor:pointer;text-align:center;
  transition:all .15s;font-family:'Tajawal',sans-serif;
  color:white;position:relative;overflow:hidden;
}
.cat-btn:active{transform:scale(0.93);}
.cat-btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.05),transparent);
}
.cat-btn .cat-emoji{font-size:1.6rem;display:block;margin-bottom:0.2rem;}
.cat-btn .cat-label{font-size:0.78rem;font-weight:700;}
.cat-btn:hover{transform:translateY(-2px);}
.cat-btn.hot{animation:catPulse 1.5s ease-in-out infinite;}
@keyframes catPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 15px currentColor}}

/* ===== BUTTONS ===== */
button{font-family:'Tajawal',sans-serif;cursor:pointer;border:none;font-weight:700;}
button:active{transform:scale(0.95);}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),#c0002a);
  color:white;padding:0.8rem 1rem;
  border-radius:3rem;width:100%;
  font-size:1rem;font-weight:900;
  box-shadow:var(--glow-accent);
  transition:all .15s;margin-bottom:0.6rem;
}
.btn-primary:hover{box-shadow:0 0 30px #ff2d5560,0 0 60px #ff2d5530;}
.btn-rand{
  background:linear-gradient(135deg,var(--purple),#6000bb);
  box-shadow:0 0 20px #b040ff60;
}
.btn-gold{
  background:linear-gradient(135deg,var(--gold),#cc9900);
  color:#000;box-shadow:var(--glow-gold);
}

/* ===== VOTE BUTTONS ===== */
.vote-grid{display:grid;gap:0.5rem;margin:0.8rem 0;}
.vote-btn{
  padding:0.8rem 0.5rem;
  border-radius:1rem;font-size:1rem;font-weight:900;
  color:white;cursor:pointer;border:none;
  position:relative;overflow:hidden;
  transition:all .1s;
  display:flex;align-items:center;justify-content:space-between;
  padding-left:1rem;padding-right:1rem;
}
.vote-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);
}
.vote-btn:active{transform:scale(0.96);}
.vote-btn .v-score{
  background:rgba(0,0,0,0.3);
  border-radius:2rem;padding:0.1rem 0.5rem;
  font-size:0.75rem;
}
.vote-btn .v-streak{font-size:0.8rem;}

/* ===== ACTION ROW ===== */
.action-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem;margin-bottom:0.6rem;}
.action-card{
  background:var(--card2);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:1rem;padding:0.7rem 0.3rem;
  cursor:pointer;text-align:center;
  transition:all .15s;font-family:'Tajawal',sans-serif;
  color:white;
}
.action-card:active{transform:scale(0.92);}
.action-card .a-icon{font-size:1.4rem;display:block;}
.action-card .a-label{font-size:0.68rem;display:block;color:#aaa;margin-top:0.2rem;}
.action-card:hover{background:rgba(255,255,255,0.07);}

/* ===== QUESTION CARD ===== */
.question-box{
  background:linear-gradient(135deg,#0d0d25,#150d20);
  border:1px solid var(--cyan)30;
  border-radius:1.5rem;padding:1.2rem;
  text-align:center;margin-bottom:0.8rem;
  box-shadow:var(--glow-cyan);
  min-height:90px;
  display:flex;align-items:center;justify-content:center;
}
.question-text{
  font-size:1.15rem;font-weight:700;
  line-height:1.5;
  animation:qFadeIn .3s ease-out;
}
@keyframes qFadeIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}

/* ===== SLOT MACHINE REVEAL ===== */
.slot-container{
  height:70px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.slot-strip{
  display:flex;flex-direction:column;
  transition:transform 0.05s;
  font-size:1.1rem;font-weight:700;
  text-align:center;line-height:70px;
}

/* ===== TARGET CARD ===== */
.target-card{
  background:linear-gradient(135deg,rgba(255,45,85,0.15),rgba(176,64,255,0.15));
  border:1px solid var(--accent)40;
  border-radius:1.2rem;padding:0.7rem 1rem;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:0.8rem;
}
.target-name{font-size:1.3rem;font-weight:900;color:var(--accent);}
.target-badge{
  background:rgba(255,45,85,0.2);
  border:1px solid var(--accent)40;
  border-radius:2rem;padding:0.2rem 0.7rem;
  font-size:0.75rem;
}

/* ===== STATS STRIP ===== */
.stats-strip{
  display:flex;gap:0.5rem;margin-bottom:0.8rem;
}
.stat-pill{
  flex:1;background:var(--card2);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:0.8rem;padding:0.4rem;
  text-align:center;
}
.stat-pill .s-val{font-size:1rem;font-weight:900;}
.stat-pill .s-lbl{font-size:0.6rem;color:#666;}

/* ===== XP BAR ===== */
.xp-bar-wrap{margin-bottom:0.8rem;}
.xp-label{display:flex;justify-content:space-between;font-size:0.72rem;color:#555;margin-bottom:0.25rem;}
.xp-track{background:#0d0d20;border-radius:2rem;height:6px;overflow:hidden;border:1px solid rgba(255,255,255,0.05);}
.xp-fill{
  height:100%;border-radius:2rem;
  background:linear-gradient(90deg,var(--purple),var(--cyan));
  transition:width .4s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.xp-fill::after{
  content:'';position:absolute;right:0;top:0;
  width:6px;height:100%;
  background:white;border-radius:50%;
  box-shadow:0 0 8px white;
}

/* ===== LEADERBOARD ===== */
.lb-row{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.5rem 0;
  border-bottom:1px solid rgba(255,255,255,0.04);
  transition:all .3s;
}
.lb-rank{
  font-size:1rem;font-weight:900;
  width:2rem;text-align:center;
}
.lb-name{flex:1;font-weight:700;font-size:0.9rem;}
.lb-score{
  font-weight:900;font-size:0.9rem;
  background:linear-gradient(135deg,var(--gold),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.lb-level{
  font-size:0.7rem;color:#555;
  background:rgba(255,255,255,0.05);
  border-radius:2rem;padding:0.1rem 0.5rem;
}

/* ===== HOT BADGE ===== */
.hot-badge{
  background:linear-gradient(135deg,var(--accent),var(--orange));
  border-radius:2rem;padding:0.15rem 0.5rem;
  font-size:0.7rem;font-weight:900;
  animation:hotPulse .8s ease-in-out infinite alternate;
}
@keyframes hotPulse{from{box-shadow:0 0 5px #ff2d55}to{box-shadow:0 0 15px #ff2d55,0 0 30px #ff7c0050}}

/* ===== COMBO METER ===== */
.combo-bar{
  background:var(--card2);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:1rem;padding:0.6rem 1rem;
  display:flex;align-items:center;gap:0.8rem;
  margin-bottom:0.8rem;
}
.combo-fire{
  font-size:1.5rem;
  animation:fireWobble 0.5s ease-in-out infinite alternate;
}
@keyframes fireWobble{from{transform:rotate(-5deg) scale(1)}to{transform:rotate(5deg) scale(1.1)}}
.combo-track{flex:1;background:#0d0d20;border-radius:2rem;height:8px;overflow:hidden;}
.combo-fill{
  height:100%;border-radius:2rem;
  background:linear-gradient(90deg,#ff7c00,#ff2d55,#b040ff);
  transition:width .3s;
}
.combo-text{font-size:0.8rem;font-weight:900;color:var(--gold);}

/* ===== TIMER ===== */
.timer-ring{
  width:60px;height:60px;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.timer-ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.timer-ring .t-num{font-size:1.1rem;font-weight:900;z-index:1;}
.timer-danger{color:var(--accent);animation:timerShake .3s ease-in-out infinite;}
@keyframes timerShake{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ===== RARITY COLORS ===== */
.rarity-common{color:#aaa;}
.rarity-rare{color:#00b4ff;}
.rarity-epic{color:var(--purple);}
.rarity-legendary{color:var(--gold);}
.badge-legendary{
  background:linear-gradient(135deg,#3d2a00,#5a3d00);
  border:1px solid var(--gold)60;
  border-radius:2rem;padding:0.15rem 0.6rem;
  font-size:0.7rem;color:var(--gold);
  box-shadow:var(--glow-gold);
  animation:legendaryGlow 2s ease-in-out infinite;
}
@keyframes legendaryGlow{0%,100%{box-shadow:0 0 8px #ffd70080}50%{box-shadow:0 0 20px #ffd700,0 0 40px #ffd70060}}
.badge-epic{background:linear-gradient(135deg,#1a0030,#2a005a);border:1px solid var(--purple)60;color:var(--purple);}
.badge-rare{background:#001530;border:1px solid #00b4ff60;color:#00b4ff;}

/* ===== EVENT CARD ===== */
.event-card{
  background:linear-gradient(135deg,rgba(255,215,0,0.1),rgba(255,124,0,0.1));
  border:1px solid var(--gold)40;
  border-radius:1.2rem;padding:0.8rem 1rem;
  margin-bottom:0.8rem;
  animation:eventPulse 1s ease-in-out infinite;
  cursor:pointer;
}
@keyframes eventPulse{0%,100%{border-color:#ffd70040}50%{border-color:#ffd700;box-shadow:0 0 15px #ffd70040}}
.event-icon{font-size:1.8rem;text-align:center;margin-bottom:0.3rem;}
.event-title{font-weight:900;text-align:center;color:var(--gold);font-size:1rem;}
.event-desc{text-align:center;font-size:0.8rem;color:#aaa;}

/* ===== AD BUTTON ===== */
.ad-btn{
  background:linear-gradient(135deg,#1a1000,#2a1800);
  border:1px solid var(--gold)40;
  border-radius:1rem;padding:0.8rem 1rem;
  color:var(--gold);font-weight:900;
  width:100%;font-size:0.9rem;
  display:flex;align-items:center;justify-content:center;gap:0.5rem;
  cursor:pointer;font-family:'Tajawal',sans-serif;
  transition:all .15s;margin-bottom:0.5rem;
}
.ad-btn:hover{box-shadow:var(--glow-gold);border-color:var(--gold)80;}

/* ===== MODAL ===== */
.modal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;z-index:100;
  padding:1rem;
}
.modal-box{
  background:linear-gradient(145deg,#0d0d20,#150d20);
  border-radius:1.5rem;padding:1.5rem;
  width:100%;max-width:360px;
  border:1px solid rgba(255,255,255,0.1);
  animation:modalIn .25s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
}
.modal-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--purple),var(--cyan));
}
@keyframes modalIn{from{opacity:0;transform:scale(0.8) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* ===== SPIN WHEEL ===== */
.wheel-container{
  width:220px;height:220px;
  position:relative;margin:0 auto;
}
.wheel-canvas{border-radius:50%;}
.wheel-pointer{
  position:absolute;top:50%;right:-15px;
  transform:translateY(-50%);
  font-size:1.5rem;
}

/* ===== TOAST ===== */
.toast{
  position:fixed;
  top:1rem;left:50%;transform:translateX(-50%);
  border-radius:3rem;font-weight:900;
  z-index:999;white-space:nowrap;
  font-size:0.9rem;padding:0.6rem 1.4rem;
  font-family:'Tajawal',sans-serif;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ===== LEVEL UP OVERLAY ===== */
.levelup-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.9);
  display:flex;align-items:center;justify-content:center;
  z-index:200;
  animation:fadeIn .2s;
}
.levelup-box{
  text-align:center;
  animation:levelUpPop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes levelUpPop{from{transform:scale(0)}to{transform:scale(1)}}
.levelup-num{
  font-size:8rem;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--orange),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===== JACKPOT FLASH ===== */
.jackpot-flash{
  position:fixed;inset:0;
  background:radial-gradient(circle,rgba(255,215,0,0.3),transparent 70%);
  pointer-events:none;z-index:50;
  animation:jackpotFlash .6s ease-out forwards;
}
@keyframes jackpotFlash{0%{opacity:1}100%{opacity:0}}

/* ===== MISSIONS ===== */
.mission-item{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.6rem 0;
  border-bottom:1px solid rgba(255,255,255,0.04);
}
.mission-progress{flex:1;height:5px;background:#1a1a30;border-radius:2rem;overflow:hidden;}
.mission-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:2rem;}
.mission-reward{font-size:0.75rem;color:var(--gold);white-space:nowrap;}

/* ===== PUNISHMENT CARD ===== */
.punishment-card{
  background:linear-gradient(135deg,rgba(255,45,85,0.2),rgba(255,0,0,0.1));
  border:1px solid var(--accent)60;
  border-radius:1.2rem;padding:0.8rem 1rem;
  text-align:center;
  animation:punishShake .3s ease-in-out 3;
}
@keyframes punishShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}

/* ===== STREAK FLAMES ===== */
.streak-display{display:flex;gap:0.2rem;flex-wrap:wrap;justify-content:center;}
.flame{font-size:1rem;animation:flameBob 0.6s ease-in-out infinite alternate;}
.flame:nth-child(even){animation-delay:0.3s;}
@keyframes flameBob{from{transform:translateY(0) scale(1)}to{transform:translateY(-3px) scale(1.1)}}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(5,5,16,0.95);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,0.06);
  display:flex;justify-content:space-around;
  padding:0.6rem 0 0.8rem;
  z-index:10;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:0.1rem;
  cursor:pointer;padding:0.3rem 1rem;
  transition:all .15s;color:#444;
  font-family:'Tajawal',sans-serif;
  border-radius:0.8rem;
}
.nav-item.active{color:var(--accent);}
.nav-item.active .nav-icon{filter:drop-shadow(0 0 6px var(--accent));}
.nav-icon{font-size:1.3rem;transition:transform .15s;}
.nav-label{font-size:0.6rem;font-weight:700;}
.nav-item:active .nav-icon{transform:scale(0.85);}
.notif-dot{
  position:absolute;top:-2px;right:-2px;
  width:8px;height:8px;
  background:var(--accent);border-radius:50%;
  animation:notifPulse 1s ease-in-out infinite;
}
@keyframes notifPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--accent)40;border-radius:2px;}

/* ===== ELIMINATION ===== */
.elim-badge{
  background:linear-gradient(135deg,#200000,#400000);
  border:1px solid #ff000060;
  border-radius:0.6rem;
  font-size:0.65rem;padding:0.1rem 0.4rem;color:#ff4444;
}

/* ===== GLOW TEXT ===== */
.glow-text-accent{text-shadow:0 0 10px var(--accent),0 0 20px var(--accent)60;}
.glow-text-gold{text-shadow:0 0 10px var(--gold),0 0 20px var(--gold)60;}
.glow-text-cyan{text-shadow:0 0 10px var(--cyan),0 0 20px var(--cyan)60;}

/* ===== PULSE RING ===== */
@keyframes pulseRing{0%{transform:scale(1);opacity:1}100%{transform:scale(2);opacity:0}}
.pulse-ring{
  width:40px;height:40px;border-radius:50%;
  border:2px solid var(--accent);
  animation:pulseRing 1s ease-out infinite;
  position:absolute;
}

// 🎮 PARTICLE ENGINE

const pCanvas = document.getElementById('particles');
const pCtx = pCanvas.getContext('2d');
let pParticles = [];
function resizeCanvas(){pCanvas.width=window.innerWidth;pCanvas.height=window.innerHeight;}
resizeCanvas();window.addEventListener('resize',resizeCanvas);

class Particle{
  constructor(x,y,color,type='circle'){
    this.x=x||Math.random()*pCanvas.width;
    this.y=y||Math.random()*pCanvas.height;
    this.vx=(Math.random()-0.5)*(type==='burst'?8:0.3);
    this.vy=(Math.random()-0.5)*(type==='burst'?8:0.3)-(type==='burst'?3:0);
    this.alpha=type==='burst'?1:Math.random()*0.4+0.1;
    this.size=type==='burst'?Math.random()*6+3:Math.random()*2+0.5;
    this.color=color||`hsl(${Math.random()*360},100%,70%)`;
    this.gravity=type==='burst'?0.15:0;
    this.life=1;this.decay=type==='burst'?0.02:0.003;this.type=type;
  }
  update(){
    this.x+=this.vx;this.y+=this.vy;
    this.vy+=this.gravity;
    this.life-=this.decay;this.alpha=this.life;
  }
  draw(){
    pCtx.save();pCtx.globalAlpha=this.alpha;
    pCtx.fillStyle=this.color;
    pCtx.beginPath();pCtx.arc(this.x,this.y,this.size,0,Math.PI*2);
    pCtx.fill();pCtx.restore();
  }
}

function spawnBurst(x,y,count=40,colors=['#ff2d55','#ffd700','#00f5ff','#b040ff']){
  for(let i=0;i<count;i++){
    pParticles.push(new Particle(x,y,colors[Math.floor(Math.random()*colors.length)],'burst'));
  }
}

// Ambient particles
for(let i=0;i<30;i++) pParticles.push(new Particle());

function animateParticles(){
  requestAnimationFrame(animateParticles);
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  pParticles=pParticles.filter(p=>p.life>0);
  while(pParticles.filter(p=>p.type==='circle').length<30){
    pParticles.push(new Particle());
  }
  pParticles.forEach(p=>{p.update();p.draw();});
}
animateParticles();

let audioCtx=null;
function getAudio(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq,dur,type='sine',vol=0.3){
  try{
    const ac=getAudio();
    const o=ac.createOscillator();const g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}

  let list=QUESTIONS[G.currentCat]||QUESTIONS.friends;

  let avail=list.filter(q=>!used.includes(q));
  if(!avail.length){G.usedQ[G.currentCat]=[];avail=list;}

  if(!G.usedQ[G.currentCat]) G.usedQ[G.currentCat]=[];

  return {text:q,rarity:'common'};
}

}

function addXP(player,amount){
  let xp=(G.xp[player]||0)+amount;
  let lvl=G.levels[player]||1;
  let gainedLevels=0;
  while(xp>=lvl*100){xp-=lvl*100;lvl++;gainedLevels++;}
  G.xp[player]=xp;
  if(gainedLevels>0){
    G.levels[player]=lvl;
    let reward=lvl*75;
    G.scores[player]+=reward;
    G.gems[player]=(G.gems[player]||0)+lvl*10;
    showLevelUp(player,lvl,reward);
    playLevelUp();
  }
  saveG();
}

function castVote(player){
  if(G.eliminatedPlayers.includes(player)){showToast("⛔ هذا اللاعب خارج من اللعب!");return;}
  
  vibrate([20]);
  playVote();
  
  let basePoints=10;
  let mult=G.comboMult;
  if(G.currentEvent?.id==='double') mult*=2;
  if(G.currentEvent?.id==='jackpot') mult=3;
  let points=basePoints*mult;
  
  // Jackpot 10% chance
  let jackpot=Math.random()<0.1;
  if(jackpot){points*=3;flashJackpot();showToast(`🎰 JACKPOT! ${player} +${points} نقطة`,'#ffd700',3000);vibrate([100,50,100]);}
  else{showToast(`😂 ${player} +${points} نقطة`,'#00ff87');}
  
  G.votes[player]=(G.votes[player]||0)+1;
  G.scores[player]=(G.scores[player]||0)+points;
  G.totalVotes=(G.totalVotes||0)+1;
  
  // XP
  addXP(player,Math.floor(points/2));
  
  // Streak
  if(player===G.lastWinner){
    G.streaks[player]=(G.streaks[player]||0)+1;
    if(G.streaks[player]>=(G.maxStreak||0)) G.maxStreak=G.streaks[player];
    if(G.streaks[player]>=3 && G.comboMult<4){
      G.comboMult=Math.min(4,G.comboMult+1);
      G.comboOwner=player;G.comboLeft=5;
      showToast(`🔥 COMBO x${G.comboMult}! ${player} في حالة!`,'#ff7c00');
      vibrate([50,30,50,30,50]);
    }
  } else {
    G.streaks[player]=1;
    if(G.lastWinner) G.streaks[G.lastWinner]=Math.max(0,(G.streaks[G.lastWinner]||1)-1);
    if(G.comboMult>1){G.comboMult=1;showToast("💔 انكسر الـ combo!");}
  }
  G.lastWinner=player;
  
  // Event: steal
  if(G.currentEvent?.id==='steal'){
    let sorted=[...G.players].filter(p=>!G.eliminatedPlayers.includes(p)).sort((a,b)=>(G.scores[b]||0)-(G.scores[a]||0));
    if(sorted.length>=2){
      let top=sorted[0];let bottom=sorted[sorted.length-1];
      let stolen=Math.min(50,G.scores[top]||0);
      G.scores[top]-=stolen;G.scores[bottom]+=stolen;
      showToast(`💀 سرقة! ${top} ← ${stolen} نقطة → ${bottom}`,'#ff2d55',3000);
    }
    G.currentEvent=null;
  }
  
  // Immunity
  if(G.currentEvent?.id==='immunity'){
    let sorted2=[...G.players].filter(p=>!G.eliminatedPlayers.includes(p)).sort((a,b)=>(G.scores[a]||0)-(G.scores[b]||0));
    G.immunePlayer=sorted2[0];
    showToast(`🛡️ ${G.immunePlayer} محمي هذه الجولة!`,'#b040ff');
    G.currentEvent=null;
  }
  
  // Event countdown
  if(G.currentEvent && G.currentEvent.duration>0){
    G.eventLeft--;
    if(G.eventLeft<=0) G.currentEvent=null;
  }
  
  // Missions
  G.missions.vote10=Math.min(G.totalVotes,10);
  G.missions.streak5=Math.min(G.maxStreak||0,5);
  checkMissions();
  saveG();
  
  spawnBurst(window.innerWidth/2,window.innerHeight*.6,20,[CATS[G.currentCat].color,'#fff','var(--gold)']);
  
  // next round
  setTimeout(()=>renderGame(),300);
}

function delPlayer(idx){
  if(G.players.length<=2){showToast("يجب بقاء لاعبين على الأقل");return;}
  let removed=G.players.splice(idx,1)[0];
  ['scores','gems','votes','challengesDone','achievements','levels','xp','streaks'].forEach(k=>delete G[k][removed]);
  saveG();renderPlayers();
}

      let old=G.players[i];let nn=inp.value;
      G.players[i]=nn;
      ['scores','gems','votes','challengesDone','achievements','levels','xp','streaks'].forEach(k=>{G[k][nn]=G[k][old];delete G[k][old];});
    }
  }
  saveG();showToast("✅ تم الحفظ",'#00ff87');
  screen='home';activeTab='home';render();
}

// SPIN WHEEL
function showSpin(){
  playClick();
  let today=new Date().toISOString().slice(0,10);
  if(G.lastSpinDate===today){showToast("⏰ العجلة مرة واحدة يومياً!",'#ff2d55');return;}
  
  let m=mkModal(`
    <div class="text-center">
      <div style="font-size:1rem;font-weight:900;margin-bottom:1rem;color:var(--gold)">🎡 عجلة الحظ</div>
      <canvas id="wheelCanvas" width="230" height="230" style="border-radius:50%;display:block;margin:0 auto;cursor:pointer"></canvas>
      <button id="spinBtn" class="btn-primary" style="margin-top:1rem">🎯 أدوّر!</button>
    </div>`);
  
  setTimeout(()=>{
    drawWheel(0);
    document.getElementById('spinBtn').onclick=()=>doSpin(m);
  },100);
}

function drawWheel(angle){
  const canvas=document.getElementById('wheelCanvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const cx=115,cy=115,r=110;
  const slices=SPIN_PRIZES.length;
  const sliceAngle=2*Math.PI/slices;
  ctx.clearRect(0,0,230,230);
  for(let i=0;i<slices;i++){
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,angle+i*sliceAngle,angle+(i+1)*sliceAngle);
    ctx.closePath();ctx.fillStyle=SPIN_PRIZES[i].color;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(angle+(i+0.5)*sliceAngle);
    ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 11px Tajawal,sans-serif';
    ctx.fillText(SPIN_PRIZES[i].label,r-8,4);ctx.restore();
  }
  // pointer
  ctx.beginPath();ctx.moveTo(cx+r+5,cy);ctx.lineTo(cx+r-15,cy-8);ctx.lineTo(cx+r-15,cy+8);
  ctx.closePath();ctx.fillStyle='#ff2d55';ctx.fill();
}

function doSpin(modal){
  let spinBtn=document.getElementById('spinBtn');
  if(spinBtn) spinBtn.disabled=true;
  let today=new Date().toISOString().slice(0,10);
  G.lastSpinDate=today;
  
  let targetIdx=Math.floor(Math.random()*SPIN_PRIZES.length);
  let spins=5+Math.random()*5;
  let totalAngle=spins*2*Math.PI+(2*Math.PI*(SPIN_PRIZES.length-targetIdx)/SPIN_PRIZES.length);
  let startTime=null;let dur=3000;let startAngle=0;
  
  function animSpin(ts){
    if(!startTime) startTime=ts;
    let t=Math.min((ts-startTime)/dur,1);
    let eased=1-Math.pow(1-t,3);
    let angle=startAngle+totalAngle*eased;
    drawWheel(angle);
    if(t<1){requestAnimationFrame(animSpin);}
    else{
      let prize=SPIN_PRIZES[targetIdx];
      G.scores[G.currentTarget]=(G.scores[G.currentTarget]||0)+prize.points;
      if(prize.bonus==='x2') G.comboMult=2;
      addXP(G.currentTarget,Math.floor(prize.points/2));
      saveG();
      if(prize.label.includes('JACKPOT')) flashJackpot();
      
      let m2=mkModal(`
        <div class="text-center">
          <div style="font-size:3rem;margin:0.5rem 0">🎡</div>
          <div style="font-size:1.5rem;font-weight:900;color:${prize.color}">${prize.label}</div>
          ${prize.points?`<div style="color:var(--green);margin-top:0.5rem">+${prize.points} نقطة</div>`:''}
          ${prize.bonus?`<div style="color:var(--cyan);margin-top:0.5rem">${prize.bonus} مفعّل!</div>`:''}
          <button onclick="this.closest('.modal').remove();renderGame();" class="btn-primary" style="margin-top:1rem">رائع! 🎉</button>
        </div>`);
      modal.remove();
      spawnBurst(window.innerWidth/2,window.innerHeight/2,50);
    }
  }
  requestAnimationFrame(animSpin);
}

// AD MODAL
function showAdModal(){
  playClick();
  if(G.extraUnlocked[G.currentCat]){
    showToast("✅ هذه الفئة مفتوحة بالفعل!");return;
  }
  let timer=30;
  let m=mkModal(`
    <div class="text-center">
      <div style="font-size:1rem;font-weight:900;margin-bottom:0.8rem;color:var(--gold)">📺 إعلان</div>
      <div id="adTimerNum" style="font-size:3.5rem;font-weight:900;color:var(--cyan)">30</div>

      <div class="xp-track" style="height:8px;margin-bottom:1rem"><div id="adProg" class="xp-fill" style="width:0%"></div></div>
      <div style="color:#aaa;font-size:0.85rem">💎 +500 جوهرة<br>📚 +20 سؤال جديد لـ ${CATS[G.currentCat].label}</div>
      <button id="adClose" class="btn-primary" style="margin-top:1rem;display:none">🎁 استلام المكافأة!</button>
    </div>`);
  
  let iv=setInterval(()=>{
    timer--;
    let tEl=document.getElementById('adTimerNum');
    let pEl=document.getElementById('adProg');
    let cEl=document.getElementById('adClose');
    if(!tEl){clearInterval(iv);return;}
    tEl.textContent=timer;
    if(pEl) pEl.style.width=((30-timer)/30*100)+'%';
    if(timer<=0){
      clearInterval(iv);
      if(tEl) tEl.textContent='✅';
      G.gems[G.currentTarget]=(G.gems[G.currentTarget]||0)+500;
      G.extraUnlocked[G.currentCat]=true;
      rebuildQ();G.usedQ[G.currentCat]=[];saveG();
      showToast(`🎉 فتحت 20 سؤال جديد لـ ${CATS[G.currentCat].label}!`,'#00ff87',3000);
      showToast('💎 +500 جوهرة!','#ffd700');
      if(cEl){cEl.style.display='block';cEl.onclick=()=>{m.remove();renderGame();};}
    }
  },1000);
}
