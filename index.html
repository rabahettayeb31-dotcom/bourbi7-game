<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🔥 شكون أكثر واحد؟ - ONLINE ULTRA</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
:root {
  --bg: #050510;
  --card: #0d0d20;
  --card2: #12122a;
  --accent: #ff2d55;
  --cyan: #00f5ff;
  --gold: #ffd700;
  --purple: #b040ff;
  --green: #00ff87;
  --orange: #ff7c00;
  --glow-accent: 0 0 20px #ff2d5580, 0 0 40px #ff2d5540;
  --glow-cyan: 0 0 20px #00f5ff80, 0 0 40px #00f5ff40;
  --glow-gold: 0 0 20px #ffd70080, 0 0 40px #ffd90050;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow-x:hidden;}
body{
  background:var(--bg);
  font-family:'Tajawal',sans-serif;
  color:#fff;
  min-height:100vh;
}
body::before{
  content:'';
  position:fixed;top:0;left:0;width:100%;height:100%;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.4;
}
body::after{
  content:'';
  position:fixed;top:0;left:0;width:100%;height:100%;
  background-image:
    linear-gradient(rgba(0,245,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,0.03) 1px,transparent 1px);
  background-size:40px 40px;
  animation:gridMove 20s linear infinite;
  pointer-events:none;z-index:0;
}
@keyframes gridMove{from{background-position:0 0}to{background-position:40px 40px}}
canvas#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
#appRoot{position:relative;z-index:2;max-width:520px;width:100%;margin:0 auto;padding:1rem 0.8rem 5rem;min-height:100vh;}

/* Cards & Buttons (same as original - keeping styles compact) */
.card{background:var(--card);border-radius:1.2rem;padding:1rem;margin-bottom:0.8rem;border:1px solid rgba(255,255,255,0.07);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.03) 0%,transparent 60%);pointer-events:none;}
.card-glow-accent{border-color:var(--accent)40;box-shadow:var(--glow-accent);}
.btn-primary{background:linear-gradient(135deg,var(--accent),#c0002a);color:white;padding:0.8rem 1rem;border-radius:3rem;width:100%;font-size:1rem;font-weight:900;box-shadow:var(--glow-accent);transition:all .15s;margin-bottom:0.6rem;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;}
.btn-primary:active{transform:scale(0.95);}
.btn-secondary{background:linear-gradient(135deg,var(--purple),#6000bb);color:white;padding:0.8rem 1rem;border-radius:3rem;width:100%;font-size:1rem;font-weight:900;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;margin-bottom:0.6rem;}
.btn-secondary:active{transform:scale(0.95);}
.room-code{background:linear-gradient(135deg,#1a1a30,#0d0d20);border:2px dashed var(--gold);border-radius:1.5rem;padding:1rem;text-align:center;margin-bottom:1rem;}
.room-code .code{font-size:2rem;font-weight:900;color:var(--gold);letter-spacing:4px;}
.players-list{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;}
.player-chip{background:var(--card2);border-radius:2rem;padding:0.4rem 0.8rem;font-size:0.85rem;display:flex;align-items:center;gap:0.3rem;}
.player-chip.host{background:linear-gradient(135deg,#ffd70020,#ff7c0020);border:1px solid var(--gold);}
.player-chip.you{background:linear-gradient(135deg,#00f5ff20,#00ff8720);border:1px solid var(--cyan);}
.waiting-spinner{text-align:center;padding:2rem;}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 1rem;}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);border-radius:3rem;font-weight:900;z-index:999;white-space:nowrap;font-size:0.9rem;padding:0.6rem 1.4rem;animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 20px rgba(0,0,0,0.5);}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.vote-btn{background:linear-gradient(135deg,#2ecc71,#27ae60);padding:0.8rem 0.5rem;border-radius:1rem;font-size:1rem;font-weight:900;color:white;cursor:pointer;border:none;display:flex;align-items:center;justify-content:space-between;padding-left:1rem;padding-right:1rem;margin-bottom:0.5rem;width:100%;}
.vote-btn:active{transform:scale(0.96);}
.role-badge{background:rgba(255,45,85,0.2);border-radius:1rem;padding:0.2rem 0.6rem;font-size:0.7rem;color:var(--accent);display:inline-block;}
.question-box{background:linear-gradient(135deg,#0d0d25,#150d20);border:1px solid var(--cyan)30;border-radius:1.5rem;padding:1.2rem;text-align:center;margin-bottom:0.8rem;box-shadow:var(--glow-cyan);}
.waiting-turn{background:rgba(0,0,0,0.5);border-radius:1rem;padding:1rem;text-align:center;color:#aaa;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(5,5,16,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-around;padding:0.6rem 0 0.8rem;z-index:10;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:0.1rem;cursor:pointer;padding:0.3rem 1rem;transition:all .15s;color:#444;font-family:'Tajawal',sans-serif;border-radius:0.8rem;}
.nav-item.active{color:var(--accent);}
.nav-icon{font-size:1.3rem;}
.nav-label{font-size:0.6rem;font-weight:700;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;}
.modal-box{background:linear-gradient(145deg,#0d0d20,#150d20);border-radius:1.5rem;padding:1.5rem;width:100%;max-width:360px;border:1px solid rgba(255,255,255,0.1);}
input{background:#0d0d20;border:1px solid rgba(255,255,255,0.1);border-radius:2rem;padding:0.8rem 1rem;color:white;font-family:'Tajawal',sans-serif;font-size:1rem;width:100%;margin-bottom:0.8rem;text-align:center;}
.flex-c{display:flex;align-items:center;justify-content:center;}
.text-center{text-align:center;}
.mt2{margin-top:0.8rem;}
.mb2{margin-bottom:0.8rem;}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div id="appRoot"></div>

<script>
// ============================================================
// 🔥 FIREBASE CONFIGURATION (Free tier - replace with your own)
// ============================================================
// IMPORTANT: Create a Firebase project at https://console.firebase.google.com/
// Then replace this config with your project's config
const firebaseConfig = {
  apiKey: "AIzaSyDemoKeyReplaceWithYourOwn",
  authDomain: "chkoun-online.firebaseapp.com",
  databaseURL: "https://chkoun-online-default-rtdb.firebaseio.com",
  projectId: "chkoun-online",
  storageBucket: "chkoun-online.firebasestorage.app",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abcdef123456"
};

// For demo purposes, we'll use localStorage fallback if Firebase fails
// But users should create their own Firebase project for real online play

let firebaseApp = null;
let database = null;
let firebaseAvailable = false;

// Try to init Firebase, fallback to localStorage mode
try {
  if (typeof firebase !== 'undefined' && firebaseConfig.apiKey !== 'AIzaSyDemoKeyReplaceWithYourOwn') {
    firebaseApp = firebase.initializeApp(firebaseConfig);
    database = firebaseApp.database();
    firebaseAvailable = true;
    console.log('🔥 Firebase connected!');
  } else {
    console.warn('⚠️ Firebase not configured. Using localStorage fallback mode.');
    firebaseAvailable = false;
  }
} catch(e) {
  console.warn('⚠️ Firebase init failed:', e);
  firebaseAvailable = false;
}

// ============================================================
// 🎮 GAME STATE (Online version)
// ============================================================
let G = {
  roomId: null,
  playerId: null,
  playerName: null,
  isHost: false,
  players: [],
  scores: {},
  currentTurn: null,
  currentQuestion: null,
  currentCategory: 'friends',
  waitingForVote: false,
  gameActive: false,
  roundEndTime: null,
  myVoteCast: false,
  results: {},
  lastUpdate: Date.now()
};

let playerNameInput = '';
let roomCodeInput = '';

// ============================================================
// 🎨 PARTICLE ENGINE (same as original, simplified)
// ============================================================
const pCanvas = document.getElementById('particles');
const pCtx = pCanvas.getContext('2d');
let pParticles = [];
function resizeCanvas(){pCanvas.width=window.innerWidth;pCanvas.height=window.innerHeight;}
resizeCanvas();window.addEventListener('resize',resizeCanvas);

class Particle{
  constructor(x,y,color){
    this.x=x||Math.random()*pCanvas.width;
    this.y=y||Math.random()*pCanvas.height;
    this.vx=(Math.random()-0.5)*0.5;
    this.vy=(Math.random()-0.5)*0.5;
    this.alpha=Math.random()*0.4+0.1;
    this.size=Math.random()*2+0.5;
    this.color=color||`hsl(${Math.random()*360},100%,70%)`;
    this.life=1;this.decay=0.003;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;this.alpha=this.life;}
  draw(){pCtx.save();pCtx.globalAlpha=this.alpha;pCtx.fillStyle=this.color;pCtx.beginPath();pCtx.arc(this.x,this.y,this.size,0,Math.PI*2);pCtx.fill();pCtx.restore();}
}
for(let i=0;i<30;i++) pParticles.push(new Particle());
function animateParticles(){
  requestAnimationFrame(animateParticles);
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  pParticles=pParticles.filter(p=>p.life>0);
  while(pParticles.length<30) pParticles.push(new Particle());
  pParticles.forEach(p=>{p.update();p.draw();});
}
animateParticles();

function spawnBurst(x,y){
  for(let i=0;i<30;i++) pParticles.push(new Particle(x,y,`hsl(${Math.random()*360},100%,60%)`));
}

function showToast(msg,bg='#ff2d55',dur=2000){
  let t=document.createElement('div');
  t.className='toast';t.innerText=msg;t.style.background=bg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),dur);
}

function playClick(){if(navigator.vibrate)navigator.vibrate(20);}

// ============================================================
// 📚 QUESTIONS DATABASE
// ============================================================
const CATS = {
  friends:{emoji:"👬",label:"الصحاب",color:"#f39c12"},
  family:{emoji:"👨‍👩‍👧‍👦",label:"العايلة",color:"#2ecc71"},
  couples:{emoji:"💑",label:"الكوبل",color:"#e84393"},
  lovers:{emoji:"💕",label:"الحبايب",color:"#9b59b6"},
  spicy:{emoji:"🔥",label:"جريء",color:"#e74c3c"}
};

const QUESTIONS = {
  friends:["شكون أكثر واحد يڨول 'أنا جاي' وهو مازال في الدار؟","شكون أكثر واحد يصرف فلوسو في القهوة؟","شكون اللي يضحك وحدو؟","شكون اللي يكذب أكثر في المجموعة؟","شكون اللي دايمن يتأخر؟"],
  family:["شكون أكثر واحد ياكل في الدار؟","شكون أكثر واحد يسرق من الثلاجة بالليل؟","شكون اللي دايمن يسبّت الضو وقت يخرج؟","شكون اللي يستعمل كل الماء الساخن؟"],
  couples:["شكون أكثر واحد يغير؟","شكون أكثر واحد يقول 'وينك؟' كل شوي؟","شكون اللي يأخذ أكثر مكان في القاعدة؟","شكون اللي دايمن يختار الرستوران؟"],
  lovers:["شكون أكثر واحد يعمل flirt؟","شكون أكثر واحد يحب الكلام الجريء؟","شكون اللي أرومانسي أكثر فيكم؟"],
  spicy:["شكون أكثر واحد عنده خبرة؟","شكون أكثر واحد يبدا أول؟","شكون اللي يكثر يخطط للقاءات سرية؟"]
};

function getRandomQuestion(cat){
  const qList = QUESTIONS[cat] || QUESTIONS.friends;
  return qList[Math.floor(Math.random() * qList.length)];
}

// ============================================================
// 🏠 SCREEN RENDERING
// ============================================================
let currentScreen = 'lobby';

function render() {
  if (currentScreen === 'lobby') renderLobby();
  else if (currentScreen === 'room') renderRoom();
  else if (currentScreen === 'game') renderGame();
  else if (currentScreen === 'waiting') renderWaiting();
}

// 🚪 LOBBY - Create or Join Room
function renderLobby() {
  const app = document.getElementById('appRoot');
  app.innerHTML = `
    <div class="text-center" style="padding:1rem 0 2rem">
      <div style="font-size:3rem;margin-bottom:0.5rem">🔥</div>
      <div style="font-size:1.5rem;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--purple),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent">شكون أكثر واحد؟</div>
      <div style="color:#aaa;margin-bottom:2rem">العب مع أصحابك أونلاين!</div>
    </div>
    
    <div class="card">
      <input type="text" id="playerNameInput" placeholder="اسمك" maxlength="15" value="${playerNameInput || ''}">
      <button class="btn-primary" onclick="createRoom()">🚀 إنشاء غرفة جديدة</button>
      <div style="text-align:center;margin:0.5rem 0;color:#555">━━ أو ━━</div>
      <input type="text" id="roomCodeInput" placeholder="رمز الغرفة" maxlength="6" value="${roomCodeInput || ''}">
      <button class="btn-secondary" onclick="joinRoom()">🔗 انضم إلى غرفة</button>
    </div>
    
    <div class="text-center text-dim" style="margin-top:1rem;font-size:0.7rem">
      ${firebaseAvailable ? '🟢 متصل بالإنترنت - العب مع أصدقائك!' : '⚠️ وضع تجريبي - أنشئ مشروع Firebase للتشغيل الكامل'}
    </div>
  `;
}

// 🏠 ROOM - Waiting for players
function renderRoom() {
  const app = document.getElementById('appRoot');
  const playerCount = G.players.length;
  const readyToStart = playerCount >= 2 && G.isHost;
  
  const playersHtml = G.players.map(p => `
    <div class="player-chip ${p.isHost ? 'host' : ''} ${p.id === G.playerId ? 'you' : ''}">
      ${p.isHost ? '👑 ' : ''}${p.name} ${p.id === G.playerId ? '(أنت)' : ''}
    </div>
  `).join('');
  
  app.innerHTML = `
    <div class="text-center" style="margin-bottom:1rem">
      <div style="font-size:0.8rem;color:#555">رمز الغرفة</div>
      <div class="room-code">
        <div class="code">${G.roomId}</div>
        <button onclick="copyRoomCode()" style="background:rgba(255,255,255,0.1);border:none;border-radius:2rem;padding:0.3rem 0.8rem;color:var(--gold);font-size:0.7rem;cursor:pointer">📋 نسخ</button>
      </div>
    </div>
    
    <div class="card">
      <div class="flex-c" style="justify-content:space-between;margin-bottom:0.5rem">
        <span>👥 اللاعبون (${playerCount}/6)</span>
        <a href="#" onclick="shareInviteLink()" style="color:var(--cyan);font-size:0.8rem">🔗 مشاركة الرابط</a>
      </div>
      <div class="players-list">${playersHtml || '<div class="text-dim">لا يوجد لاعبين</div>'}</div>
    </div>
    
    <div class="waiting-spinner">
      <div class="spinner"></div>
      <div>${G.isHost ? 'بانتظار انضمام لاعبين آخرين...' : 'بانتظار بدء المباراة من قبل المضيف...'}</div>
      ${readyToStart ? `<button class="btn-primary mt2" onclick="startGame()">🎮 بدء اللعب</button>` : ''}
    </div>
    
    <button class="btn-secondary" onclick="leaveRoom()" style="background:rgba(255,45,85,0.2);box-shadow:none">🚪 مغادرة الغرفة</button>
  `;
}

// ⏳ Waiting for turn
function renderWaiting() {
  const app = document.getElementById('appRoot');
  app.innerHTML = `
    <div class="text-center" style="padding:2rem">
      <div class="spinner" style="width:50px;height:50px"></div>
      <div style="font-size:1.2rem;font-weight:900;margin:1rem 0">دور لاعب آخر...</div>
      <div class="card" style="background:rgba(0,0,0,0.3)">
        <div>سؤال الجولة:</div>
        <div style="font-weight:700;margin-top:0.5rem">${G.currentQuestion || '...'}</div>
      </div>
      <button class="btn-secondary mt2" onclick="refreshRoomState()" style="background:rgba(255,255,255,0.1)">🔄 تحديث</button>
    </div>
  `;
}

// 🎮 Game screen - voting phase
function renderGame() {
  const app = document.getElementById('appRoot');
  const cat = CATS[G.currentCategory];
  const timeLeft = G.roundEndTime ? Math.max(0, Math.floor((G.roundEndTime - Date.now()) / 1000)) : 30;
  
  let voteButtons = '';
  if (!G.waitingForVote || G.myVoteCast) {
    voteButtons = `<div class="waiting-turn">${G.myVoteCast ? '✅ لقد صوّت! انتظر النتائج...' : '⏳ ينتظر صوتك...'}</div>`;
  } else {
    voteButtons = G.players.filter(p => p.id !== G.playerId).map(p => `
      <button class="vote-btn" onclick="castVote('${p.id}')" style="background:${cat.color}80">
        <span>${p.name}</span>
        <span class="v-score">${G.scores[p.id] || 0}★</span>
      </button>
    `).join('');
  }
  
  app.innerHTML = `
    <div class="top-header" style="display:flex;justify-content:space-between;margin-bottom:0.5rem">
      <div style="background:${cat.color}20;border-radius:2rem;padding:0.3rem 0.9rem;font-size:0.8rem">${cat.emoji} ${cat.label}</div>
      <div class="role-badge">دور: ${G.players.find(p => p.id === G.currentTurn)?.name || '?'}</div>
    </div>
    
    <div class="question-box">
      <div class="question-text" style="font-size:1.1rem">${G.currentQuestion || '...'}</div>
    </div>
    
    <div class="card">
      <div class="flex-c" style="justify-content:space-between;margin-bottom:0.5rem">
        <span>⏱️ متبقي: <span id="timer" style="color:var(--accent);font-weight:900">${timeLeft}</span> ثانية</span>
        <span>👥 ${G.players.length} لاعب</span>
      </div>
      <div class="players-list" style="margin-bottom:0.5rem">
        ${G.players.map(p => `<div class="player-chip ${p.id === G.currentTurn ? 'host' : ''}">${p.name} ${p.id === G.currentTurn ? '🎯' : ''}</div>`).join('')}
      </div>
    </div>
    
    <div class="section-title" style="font-size:0.75rem;color:#555;margin-bottom:0.3rem">👇 اختر من يستحق النقطة</div>
    ${voteButtons}
    
    <button class="btn-secondary mt2" onclick="leaveRoom()" style="background:rgba(255,255,255,0.05);margin-top:1rem">🚪 مغادرة</button>
  `;
  
  // Timer countdown
  if (G.roundEndTime && !G.myVoteCast) {
    const timerEl = document.getElementById('timer');
    if (timerEl) {
      const interval = setInterval(() => {
        const left = Math.max(0, Math.floor((G.roundEndTime - Date.now()) / 1000));
        if (timerEl) timerEl.innerText = left;
        if (left <= 0 || G.myVoteCast) clearInterval(interval);
      }, 1000);
    }
  }
}

// ============================================================
// 🔥 FIREBASE DATABASE FUNCTIONS
// ============================================================

function generateRoomId() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}

function generatePlayerId() {
  return 'p_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
}

function createRoom() {
  const name = document.getElementById('playerNameInput')?.value.trim();
  if (!name) { showToast('❌ أدخل اسمك أولاً'); return; }
  playerNameInput = name;
  G.playerName = name;
  G.playerId = generatePlayerId();
  G.roomId = generateRoomId();
  G.isHost = true;
  G.players = [{ id: G.playerId, name: G.playerName, isHost: true }];
  G.scores = {};
  G.scores[G.playerId] = 0;
  G.gameActive = false;
  G.currentTurn = G.playerId;
  G.waitingForVote = false;
  
  if (firebaseAvailable && database) {
    const roomRef = database.ref('rooms/' + G.roomId);
    roomRef.set({
      hostId: G.playerId,
      players: G.players,
      scores: G.scores,
      gameActive: false,
      currentTurn: G.playerId,
      currentCategory: 'friends',
      currentQuestion: null,
      waitingForVote: false,
      roundEndTime: null,
      createdAt: Date.now()
    }).then(() => {
      listenToRoom();
      currentScreen = 'room';
      render();
      showToast(`✅ غرفة ${G.roomId} تم إنشاؤها!`, '#00ff87');
      copyRoomCodeToClipboard();
    }).catch(err => {
      console.error(err);
      showToast('❌ فشل إنشاء الغرفة, حاول مرة أخرى');
    });
  } else {
    // Fallback - localStorage mode (single player demo)
    showToast('⚠️ وضع تجريبي - أنشئ مشروع Firebase للعب متعدد', '#ff7c00');
    currentScreen = 'room';
    render();
  }
}

function joinRoom() {
  const name = document.getElementById('playerNameInput')?.value.trim();
  const code = document.getElementById('roomCodeInput')?.value.trim().toUpperCase();
  if (!name) { showToast('❌ أدخل اسمك أولاً'); return; }
  if (!code) { showToast('❌ أدخل رمز الغرفة'); return; }
  playerNameInput = name;
  G.playerName = name;
  G.playerId = generatePlayerId();
  G.roomId = code;
  G.isHost = false;
  
  if (firebaseAvailable && database) {
    const roomRef = database.ref('rooms/' + code);
    roomRef.once('value').then(snapshot => {
      const room = snapshot.val();
      if (!room) {
        showToast('❌ الغرفة غير موجودة');
        return;
      }
      if (room.players.length >= 6) {
        showToast('❌ الغرفة ممتلئة (حد أقصى 6 لاعبين)');
        return;
      }
      const newPlayer = { id: G.playerId, name: G.playerName, isHost: false };
      const updatedPlayers = [...room.players, newPlayer];
      const updatedScores = { ...room.scores, [G.playerId]: 0 };
      roomRef.update({
        players: updatedPlayers,
        scores: updatedScores
      }).then(() => {
        listenToRoom();
        currentScreen = 'room';
        render();
        showToast(`✅ انضممت إلى الغرفة ${code}!`, '#00ff87');
      });
    }).catch(err => {
      showToast('❌ فشل الاتصال بالغرفة');
    });
  } else {
    showToast('⚠️ وضع تجريبي - لا يمكن الانضمام بدون Firebase', '#ff7c00');
  }
}

function listenToRoom() {
  if (!firebaseAvailable || !database) return;
  const roomRef = database.ref('rooms/' + G.roomId);
  roomRef.on('value', (snapshot) => {
    const room = snapshot.val();
    if (!room) {
      showToast('❌ الغرفة أغلقت');
      currentScreen = 'lobby';
      render();
      return;
    }
    
    // Update local state
    G.players = room.players || [];
    G.scores = room.scores || {};
    G.gameActive = room.gameActive || false;
    G.currentTurn = room.currentTurn;
    G.currentQuestion = room.currentQuestion;
    G.waitingForVote = room.waitingForVote || false;
    G.roundEndTime = room.roundEndTime;
    G.currentCategory = room.currentCategory || 'friends';
    
    // Check if it's my turn to vote
    const myTurnToVote = G.gameActive && G.waitingForVote && G.currentTurn === G.playerId;
    const hasVoted = room.votes && room.votes[G.playerId];
    G.myVoteCast = hasVoted || false;
    
    // Determine screen
    if (!G.gameActive) {
      currentScreen = 'room';
    } else if (myTurnToVote && !hasVoted) {
      currentScreen = 'game';
    } else if (G.gameActive && (!myTurnToVote || hasVoted)) {
      currentScreen = 'waiting';
    }
    
    // Check if round ended and show results
    if (room.roundResults && !room.resultsShown) {
      showRoundResults(room.roundResults);
      database.ref('rooms/' + G.roomId).update({ resultsShown: true });
    }
    
    render();
  });
}

function startGame() {
  if (!G.isHost) return;
  const catKeys = Object.keys(CATS);
  const randomCat = catKeys[Math.floor(Math.random() * catKeys.length)];
  const firstPlayer = G.players[0]?.id;
  
  database.ref('rooms/' + G.roomId).update({
    gameActive: true,
    currentTurn: firstPlayer,
    currentCategory: randomCat,
    currentQuestion: getRandomQuestion(randomCat),
    waitingForVote: true,
    roundEndTime: Date.now() + 30000,
    votes: {},
    roundResults: null,
    resultsShown: false
  }).then(() => {
    showToast('🎮 المباراة بدأت!', '#00ff87');
  });
}

function castVote(targetPlayerId) {
  if (!G.waitingForVote || G.currentTurn !== G.playerId || G.myVoteCast) {
    showToast('❌ ليس دورك الآن');
    return;
  }
  
  const points = 10;
  const roomRef = database.ref('rooms/' + G.roomId);
  
  roomRef.once('value').then(snapshot => {
    const room = snapshot.val();
    const currentScores = room.scores || {};
    const newScores = { ...currentScores };
    newScores[targetPlayerId] = (newScores[targetPlayerId] || 0) + points;
    
    const votes = room.votes || {};
    votes[G.playerId] = targetPlayerId;
    
    // Check if all players have voted
    const allVoted = G.players.every(p => votes[p.id]);
    
    roomRef.update({
      scores: newScores,
      votes: votes,
      waitingForVote: !allVoted,
      roundResults: allVoted ? { winner: targetPlayerId, points: points, votesCount: Object.values(votes).length } : null
    });
    
    showToast(`✅ صوّت لـ ${G.players.find(p => p.id === targetPlayerId)?.name} +${points} نقطة`, '#00ff87');
    spawnBurst(window.innerWidth/2, window.innerHeight/2);
    
    if (allVoted) {
      // Move to next player after delay
      setTimeout(() => {
        const currentIndex = G.players.findIndex(p => p.id === G.currentTurn);
        const nextPlayer = G.players[(currentIndex + 1) % G.players.length];
        const newCat = Object.keys(CATS)[Math.floor(Math.random() * Object.keys(CATS).length)];
        database.ref('rooms/' + G.roomId).update({
          currentTurn: nextPlayer.id,
          currentCategory: newCat,
          currentQuestion: getRandomQuestion(newCat),
          waitingForVote: true,
          roundEndTime: Date.now() + 30000,
          votes: {},
          roundResults: null,
          resultsShown: false
        });
      }, 3000);
    }
  });
}

function showRoundResults(results) {
  showToast(`🎉 ${results.winner} حصل على ${results.points} نقطة!`, '#ffd700', 2500);
  spawnBurst(window.innerWidth/2, window.innerHeight/2);
}

function leaveRoom() {
  if (firebaseAvailable && database && G.roomId) {
    const roomRef = database.ref('rooms/' + G.roomId);
    roomRef.once('value').then(snapshot => {
      const room = snapshot.val();
      if (room) {
        const updatedPlayers = room.players.filter(p => p.id !== G.playerId);
        if (updatedPlayers.length === 0) {
          roomRef.remove();
        } else {
          roomRef.update({ players: updatedPlayers });
        }
      }
    });
  }
  G.roomId = null;
  G.playerId = null;
  G.isHost = false;
  currentScreen = 'lobby';
  render();
}

function refreshRoomState() {
  if (firebaseAvailable && G.roomId) {
    const roomRef = database.ref('rooms/' + G.roomId);
    roomRef.once('value').then(snapshot => {
      const room = snapshot.val();
      if (room) {
        G.players = room.players || [];
        G.scores = room.scores || {};
        G.gameActive = room.gameActive;
        G.currentTurn = room.currentTurn;
        G.currentQuestion = room.currentQuestion;
        G.waitingForVote = room.waitingForVote;
        render();
      }
    });
  }
}

function copyRoomCode() {
  copyRoomCodeToClipboard();
}

function copyRoomCodeToClipboard() {
  if (G.roomId) {
    navigator.clipboard.writeText(G.roomId);
    showToast('📋 تم نسخ رمز الغرفة!', '#00ff87');
  }
}

function shareInviteLink() {
  const url = window.location.href;
  const text = `انضم للعب "شكون أكثر واحد؟" معي! رمز الغرفة: ${G.roomId}`;
  if (navigator.share) {
    navigator.share({ title: 'شكون أكثر واحد؟', text: text, url: url });
  } else {
    copyRoomCodeToClipboard();
  }
}

// ============================================================
// 🚀 INIT
// ============================================================
render();
</script>
