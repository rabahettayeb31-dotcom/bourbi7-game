function genCode(){ 
const chars='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; 
let c=''; 
for(let i=0;i<5;i++) c+=chars[Math.floor(Math.random()*chars.length)]; 
return c; 
} 
function genId(){return Math.random().toString(36).substr(2,10);} 
function pickQuestion(category, usedIdxs){ 
if(Math.random()<0.05){ 
return {text:LEGENDARY[Math.floor(Math.random()*LEGENDARY.length)],idx:
1,rarity:'legendary'}; 
} 
const pool=Q[category]||Q.friends; 
const avail=pool.map((t,i)=>({t,i})).filter(({i})=>!usedIdxs.includes(i)); 
if(!avail.length){const 
i=Math.floor(Math.random()*pool.length);return{text:pool[i],idx:i,rarity:'common'};} 
const pick=avail[Math.floor(Math.random()*avail.length)]; 
return{text:pick.t,idx:pick.i,rarity:'common'}; 
} 
function computeVoteResult(votes,players){ 
const counts={}; 
for(const [tid,voterIds] of Object.entries(votes)){ 
counts[tid]=(counts[tid]||0)+voterIds.length; 
} 
let winnerId=null,maxV=0; 
for(const [tid,cnt] of Object.entries(counts)){ 
if(cnt>maxV){maxV=cnt;winnerId=tid;} 
} 
const winner=players.find(p=>p.id===winnerId); 
return{winnerId,winnerName:winner?.name||'',voteCount:maxV,counts}; 
}

function startPolling(code){ 
stopPolling(); 
pollingInterval=setInterval(()=>{ 
const r=readRoom(code); 
if(!r)return; 
if(r.lastUpdate===prevUpdate)return; 
prevUpdate=r.lastUpdate; 
const prev=state.room; 
if(prev?.status!==r.status){ 
if(r.status==='waiting'){setState({room:r,screen:'waiting'});stopTimer();} 
if(r.status==='playing'){setState({room:r,screen:'playing',myVote:null});startTimer(r.timerStart
);} 
if(r.status==='roundEnd'){setState({room:r,screen:'roundEnd'});stopTimer();} 
if(r.status==='finished'){setState({room:r,screen:'finished'});stopTimer();} 
} else { 
setState({room:r}); 
} 
},1000); 
// Listen to broadcast channel 
if(bc) bc.onmessage=(e)=>{ 
if(e.data.code===code){ 
const r=readRoom(code); 
if(!r)return; 
if(r.lastUpdate===prevUpdate)return; 
prevUpdate=r.lastUpdate; 
const prev=state.room; 
if(prev?.status!==r.status){ 
if(r.status==='waiting'){setState({room:r,screen:'waiting'});stopTimer();} 
if(r.status==='playing'){setState({room:r,screen:'playing',myVote:null});startTimer(r.timerStart
);} 
if(r.status==='roundEnd'){setState({room:r,screen:'roundEnd'});stopTimer();} 
if(r.status==='finished'){setState({room:r,screen:'finished'});stopTimer();} 
} else { 
setState({room:r}); 
} 
} 
}; 
}

function handleVote(targetId){

const hasVoted=[...r.hasVoted,myId];

function offlineVote(targetName){ 
const voter=state.offlinePlayers[state.offlineVoterIndex]; 
if(!voter||state.offlineHasVoted.includes(voter))return; 
const votes={...state.offlineVotes}; 
if(!votes[targetName])votes[targetName]=[]; 
votes[targetName]=[...votes[targetName],voter]; 
const hasVoted=[...state.offlineHasVoted,voter]; 
const nextVoterIndex=state.offlineVoterIndex+1; 
if(nextVoterIndex>=state.offlinePlayers.length){ 
// all voted, compute result 
offlineEndRound(votes,hasVoted); 
} else { 
setState({offlineVotes:votes,offlineHasVoted:hasVoted,offlineVoterIndex:nextVoterIndex}); 
} 
} 
function offlineEndRound(votes,hasVoted){ 
const counts={}; 
for(const [name,voters] of 
Object.entries(votes)){counts[name]=(counts[name]||0)+voters.length;} 
let winnerName=null,maxV=0; 
for(const [name,cnt] of 
Object.entries(counts)){if(cnt>maxV){maxV=cnt;winnerName=name;}} 
const scores={...state.offlineScores}; 
const mult=state.offlineComboMult||1; 
state.offlinePlayers.forEach(p=>{ 
const voteCount=counts[p]||0; 
let pts=0,xp=0; 
if(p===winnerName){pts=10*voteCount*mult;xp=pts;} 
const votedForWinner=(votes[winnerName]||[]).includes(p); 
if(votedForWinner&&p!==winnerName){pts+=5*mult;xp+=5;} 
const s=scores[p]; 
const newXp=(s.xp||0)+xp; 
const lvl=s.level||1; 
scores[p]={...s,score:(s.score||0)+pts,xp:newXp>=lvl*100?newXp
lvl*100:newXp,level:newXp>=lvl*100?lvl+1:lvl,gems:(s.gems||0)+Math.floor(pts/5),streak:p
===winnerName?(s.streak||0)+1:0,votes_received:(s.votes_received||0)+voteCount}; 
}); 
const 
comboMult=winnerName===state.offlineLastWinnerId?Math.min(4,(state.offlineComboMul
t||1)+1):1; 
setState({ 
screen:'offline_roundEnd', 
offlineScores:scores, 
offlineVotes:votes, 
offlineHasVoted:hasVoted, 
offlineRoundWinner:{name:winnerName,voteCount:maxV,counts},

offlineLastWinnerId:winnerName, 
}); 
}

function el(tag,attrs={},children=[]){ 
const e=document.createElement(tag); 
for(const [k,v] of Object.entries(attrs)){ 
if(k==='className')e.className=v; 
else if(k==='style'&&typeof v==='object')Object.assign(e.style,v); 
else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v); 
else e.setAttribute(k,v); 
} 
for(const c of children){ 
if(c==null||c===false)continue; 
if(typeof c==='string'||typeof c==='number')e.appendChild(document.createTextNode(c)); 
else e.appendChild(c); 
} 
return e; 
}

(function init(){ 
const savedCode=sessionStorage.getItem('cq_room'); 
const savedName=sessionStorage.getItem('cq_name'); 
if(savedCode&&savedName){ 
const r=readRoom(savedCode); 
if(r&&r.players.find(p=>p.id===myId)){

else 
if(r.status==='playing'){state.myVote=null;state.screen='playing';startTimer(r.timerStart);} 
else if(r.status==='roundEnd')state.screen='roundEnd';

} 
}
