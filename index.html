<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🔥 شكون أكثر واحد؟ ULTRA</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
<style>
:root{
  --bg:#050510;--card:#0d0d20;--card2:#12122a;
  --accent:#ff2d55;--cyan:#00f5ff;--gold:#ffd700;
  --purple:#b040ff;--green:#00ff87;--orange:#ff7c00;
  --glow-accent:0 0 20px #ff2d5580,0 0 40px #ff2d5540;
  --glow-cyan:0 0 20px #00f5ff80,0 0 40px #00f5ff40;
  --glow-gold:0 0 20px #ffd70080,0 0 40px #ffd90050;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow-x:hidden;}
body{background:var(--bg);font-family:'Tajawal',sans-serif;color:#fff;min-height:100vh;}

body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.4;}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;
  background-image:linear-gradient(rgba(0,245,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,0.03) 1px,transparent 1px);
  background-size:40px 40px;animation:gridMove 20s linear infinite;pointer-events:none;z-index:0;}
@keyframes gridMove{from{background-position:0 0}to{background-position:40px 40px}}

canvas#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
#appRoot{position:relative;z-index:2;max-width:520px;width:100%;margin:0 auto;padding:1rem 0.8rem 5rem;min-height:100vh;}

.top-header{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0 1rem;}
.logo{font-size:1.1rem;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--purple),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:logoShimmer 3s linear infinite;background-size:200%;}
@keyframes logoShimmer{0%{background-position:0%}100%{background-position:200%}}

.card{background:var(--card);border-radius:1.2rem;padding:1rem;margin-bottom:0.8rem;border:1px solid rgba(255,255,255,0.07);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.03) 0%,transparent 60%);pointer-events:none;}
.card-glow-accent{border-color:var(--accent)40;box-shadow:var(--glow-accent);}
.card-glow-cyan{border-color:var(--cyan)40;box-shadow:var(--glow-cyan);}
.card-glow-gold{border-color:var(--gold)40;box-shadow:var(--glow-gold);}

.champ-banner{background:linear-gradient(135deg,#1a0020,#200010,#0a1a30);border:1px solid var(--gold)50;border-radius:1.5rem;padding:1rem;text-align:center;box-shadow:var(--glow-gold);position:relative;overflow:hidden;margin-bottom:1rem;}
.champ-banner::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(transparent 0deg,var(--gold)10 10deg,transparent 20deg);animation:champSpin 8s linear infinite;opacity:.15;}
@keyframes champSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.champ-crown{font-size:2rem;animation:crownFloat 2s ease-in-out infinite;}
@keyframes crownFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.champ-name{font-size:1.4rem;font-weight:900;color:var(--gold);}
.champ-score{font-size:0.9rem;color:#aaa;}

.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;margin-bottom:1rem;}
.cat-btn{background:var(--card2);border:1px solid rgba(255,255,255,0.08);border-radius:1rem;padding:0.7rem 0.3rem;cursor:pointer;text-align:center;transition:all .15s;font-family:'Tajawal',sans-serif;color:white;position:relative;overflow:hidden;}
.cat-btn:active{transform:scale(0.93);}
.cat-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.05),transparent);}
.cat-btn .cat-emoji{font-size:1.6rem;display:block;margin-bottom:0.2rem;}
.cat-btn .cat-label{font-size:0.78rem;font-weight:700;}
.cat-btn:hover{transform:translateY(-2px);}
.cat-btn.hot{animation:catPulse 1.5s ease-in-out infinite;}
@keyframes catPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 15px currentColor}}

button{font-family:'Tajawal',sans-serif;cursor:pointer;border:none;font-weight:700;}
button:active{transform:scale(0.95);}
.btn-primary{background:linear-gradient(135deg,var(--accent),#c0002a);color:white;padding:0.8rem 1rem;border-radius:3rem;width:100%;font-size:1rem;font-weight:900;box-shadow:var(--glow-accent);transition:all .15s;margin-bottom:0.6rem;}
.btn-primary:hover{box-shadow:0 0 30px #ff2d5560,0 0 60px #ff2d5530;}
.btn-rand{background:linear-gradient(135deg,var(--purple),#6000bb);box-shadow:0 0 20px #b040ff60;}
.btn-gold{background:linear-gradient(135deg,var(--gold),#cc9900);color:#000;box-shadow:var(--glow-gold);}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),#0099cc);color:#000;box-shadow:var(--glow-cyan);}
.btn-green{background:linear-gradient(135deg,var(--green),#00cc66);color:#000;}

.vote-grid{display:grid;gap:0.5rem;margin:0.8rem 0;}
.vote-btn{padding:0.8rem 0.5rem;border-radius:1rem;font-size:1rem;font-weight:900;color:white;cursor:pointer;border:none;position:relative;overflow:hidden;transition:all .1s;display:flex;align-items:center;justify-content:space-between;padding-left:1rem;padding-right:1rem;}
.vote-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);}
.vote-btn:active{transform:scale(0.96);}
.vote-btn .v-score{background:rgba(0,0,0,0.3);border-radius:2rem;padding:0.1rem 0.5rem;font-size:0.75rem;}

.action-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem;margin-bottom:0.6rem;}
.action-card{background:var(--card2);border:1px solid rgba(255,255,255,0.08);border-radius:1rem;padding:0.7rem 0.3rem;cursor:pointer;text-align:center;transition:all .15s;font-family:'Tajawal',sans-serif;color:white;}
.action-card:active{transform:scale(0.92);}
.action-card .a-icon{font-size:1.4rem;display:block;}
.action-card .a-label{font-size:0.68rem;display:block;color:#aaa;margin-top:0.2rem;}
.action-card:hover{background:rgba(255,255,255,0.07);}

.question-box{background:linear-gradient(135deg,#0d0d25,#150d20);border:1px solid var(--cyan)30;border-radius:1.5rem;padding:1.2rem;text-align:center;margin-bottom:0.8rem;box-shadow:var(--glow-cyan);min-height:90px;display:flex;align-items:center;justify-content:center;}
.question-text{font-size:1.15rem;font-weight:700;line-height:1.5;animation:qFadeIn .3s ease-out;}
@keyframes qFadeIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}

.target-card{background:linear-gradient(135deg,rgba(255,45,85,0.15),rgba(176,64,255,0.15));border:1px solid var(--accent)40;border-radius:1.2rem;padding:0.7rem 1rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:0.8rem;}
.target-name{font-size:1.3rem;font-weight:900;color:var(--accent);}
.target-badge{background:rgba(255,45,85,0.2);border:1px solid var(--accent)40;border-radius:2rem;padding:0.2rem 0.7rem;font-size:0.75rem;}

.stats-strip{display:flex;gap:0.5rem;margin-bottom:0.8rem;}
.stat-pill{flex:1;background:var(--card2);border:1px solid rgba(255,255,255,0.06);border-radius:0.8rem;padding:0.4rem;text-align:center;}
.stat-pill .s-val{font-size:1rem;font-weight:900;}
.stat-pill .s-lbl{font-size:0.6rem;color:#666;}

.xp-bar-wrap{margin-bottom:0.8rem;}
.xp-label{display:flex;justify-content:space-between;font-size:0.72rem;color:#555;margin-bottom:0.25rem;}
.xp-track{background:#0d0d20;border-radius:2rem;height:6px;overflow:hidden;border:1px solid rgba(255,255,255,0.05);}
.xp-fill{height:100%;border-radius:2rem;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .4s cubic-bezier(.34,1.56,.64,1);position:relative;}
.xp-fill::after{content:'';position:absolute;right:0;top:0;width:6px;height:100%;background:white;border-radius:50%;box-shadow:0 0 8px white;}

.lb-row{display:flex;align-items:center;gap:0.7rem;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.04);transition:all .3s;}
.lb-score{font-weight:900;font-size:0.9rem;background:linear-gradient(135deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.hot-badge{background:linear-gradient(135deg,var(--accent),var(--orange));border-radius:2rem;padding:0.15rem 0.5rem;font-size:0.7rem;font-weight:900;animation:hotPulse .8s ease-in-out infinite alternate;}
@keyframes hotPulse{from{box-shadow:0 0 5px #ff2d55}to{box-shadow:0 0 15px #ff2d55,0 0 30px #ff7c0050}}

.combo-bar{background:var(--card2);border:1px solid rgba(255,255,255,0.06);border-radius:1rem;padding:0.6rem 1rem;display:flex;align-items:center;gap:0.8rem;margin-bottom:0.8rem;}
.combo-fire{font-size:1.5rem;animation:fireWobble 0.5s ease-in-out infinite alternate;}
@keyframes fireWobble{from{transform:rotate(-5deg) scale(1)}to{transform:rotate(5deg) scale(1.1)}}
.combo-track{flex:1;background:#0d0d20;border-radius:2rem;height:8px;overflow:hidden;}
.combo-fill{height:100%;border-radius:2rem;background:linear-gradient(90deg,#ff7c00,#ff2d55,#b040ff);transition:width .3s;}
.combo-text{font-size:0.8rem;font-weight:900;color:var(--gold);}

.event-card{background:linear-gradient(135deg,rgba(255,215,0,0.1),rgba(255,124,0,0.1));border:1px solid var(--gold)40;border-radius:1.2rem;padding:0.8rem 1rem;margin-bottom:0.8rem;animation:eventPulse 1s ease-in-out infinite;cursor:pointer;}
@keyframes eventPulse{0%,100%{border-color:#ffd70040}50%{border-color:#ffd700;box-shadow:0 0 15px #ffd70040}}
.event-icon{font-size:1.8rem;text-align:center;margin-bottom:0.3rem;}
.event-title{font-weight:900;text-align:center;color:var(--gold);font-size:1rem;}
.event-desc{text-align:center;font-size:0.8rem;color:#aaa;}

.ad-btn{background:linear-gradient(135deg,#1a1000,#2a1800);border:1px solid var(--gold)40;border-radius:1rem;padding:0.8rem 1rem;color:var(--gold);font-weight:900;width:100%;font-size:0.9rem;display:flex;align-items:center;justify-content:center;gap:0.5rem;cursor:pointer;font-family:'Tajawal',sans-serif;transition:all .15s;margin-bottom:0.5rem;}
.ad-btn:hover{box-shadow:var(--glow-gold);border-color:var(--gold)80;}

.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;}
.modal-box{background:linear-gradient(145deg,#0d0d20,#150d20);border-radius:1.5rem;padding:1.5rem;width:100%;max-width:360px;border:1px solid rgba(255,255,255,0.1);animation:modalIn .25s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;}
.modal-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--cyan));}
@keyframes modalIn{from{opacity:0;transform:scale(0.8) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}

.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);border-radius:3rem;font-weight:900;z-index:999;white-space:nowrap;font-size:0.9rem;padding:0.6rem 1.4rem;font-family:'Tajawal',sans-serif;animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 20px rgba(0,0,0,0.5);}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.levelup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .2s;}
.levelup-box{text-align:center;animation:levelUpPop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes levelUpPop{from{transform:scale(0)}to{transform:scale(1)}}
.levelup-num{font-size:8rem;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--orange),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.jackpot-flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,215,0,0.3),transparent 70%);pointer-events:none;z-index:50;animation:jackpotFlash .6s ease-out forwards;}
@keyframes jackpotFlash{0%{opacity:1}100%{opacity:0}}

.mission-item{display:flex;align-items:center;gap:0.7rem;padding:0.6rem 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.mission-progress{flex:1;height:5px;background:#1a1a30;border-radius:2rem;overflow:hidden;}
.mission-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:2rem;}
.mission-reward{font-size:0.75rem;color:var(--gold);white-space:nowrap;}
.punishment-card{background:linear-gradient(135deg,rgba(255,45,85,0.2),rgba(255,0,0,0.1));border:1px solid var(--accent)60;border-radius:1.2rem;padding:0.8rem 1rem;text-align:center;}
.streak-display{display:flex;gap:0.2rem;flex-wrap:wrap;justify-content:center;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(5,5,16,0.97);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-around;padding:0.5rem 0 0.7rem;z-index:10;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:0.1rem;cursor:pointer;padding:0.3rem 0.5rem;transition:all .15s;color:#444;font-family:'Tajawal',sans-serif;border-radius:0.8rem;min-width:52px;}
.nav-item.active{color:var(--accent);}
.nav-item.active .nav-icon{filter:drop-shadow(0 0 6px var(--accent));}
.nav-icon{font-size:1.2rem;transition:transform .15s;}
.nav-label{font-size:0.58rem;font-weight:700;}
.nav-item:active .nav-icon{transform:scale(0.85);}
.notif-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--accent);border-radius:50%;animation:notifPulse 1s ease-in-out infinite;}
@keyframes notifPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

.elim-badge{background:linear-gradient(135deg,#200000,#400000);border:1px solid #ff000060;border-radius:0.6rem;font-size:0.65rem;padding:0.1rem 0.4rem;color:#ff4444;}
.badge-legendary{background:linear-gradient(135deg,#3d2a00,#5a3d00);border:1px solid var(--gold)60;border-radius:2rem;padding:0.15rem 0.6rem;font-size:0.7rem;color:var(--gold);box-shadow:var(--glow-gold);animation:legendaryGlow 2s ease-in-out infinite;}
@keyframes legendaryGlow{0%,100%{box-shadow:0 0 8px #ffd70080}50%{box-shadow:0 0 20px #ffd700,0 0 40px #ffd70060}}
.badge-epic{background:linear-gradient(135deg,#1a0030,#2a005a);border:1px solid var(--purple)60;color:var(--purple);border-radius:2rem;padding:0.15rem 0.6rem;font-size:0.7rem;}
.glow-text-gold{text-shadow:0 0 10px var(--gold),0 0 20px var(--gold)60;}
.glow-text-cyan{text-shadow:0 0 10px var(--cyan),0 0 20px var(--cyan)60;}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--accent)40;border-radius:2px;}

/* ===== UTILITIES ===== */
.flex-c{display:flex;align-items:center;justify-content:center;}
.flex-b{display:flex;align-items:center;justify-content:space-between;}
.text-center{text-align:center;}
.mt1{margin-top:0.4rem;}.mt2{margin-top:0.8rem;}
.text-dim{color:#555;font-size:0.8rem;}
.text-gold{color:var(--gold);}
.section-title{font-size:0.75rem;font-weight:900;color:#444;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.5rem;}

/* ========== ONLINE MODE CSS ========== */
.room-code-display{display:flex;gap:0.4rem;justify-content:center;margin:1.2rem 0;}
.room-code-char{width:2.6rem;height:3rem;background:linear-gradient(135deg,#0a0a20,#12122a);border:2px solid var(--cyan)60;border-radius:0.8rem;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;color:var(--cyan);box-shadow:0 0 15px #00f5ff40;animation:codeCharGlow 2s ease-in-out infinite;}
@keyframes codeCharGlow{0%,100%{border-color:var(--cyan)40;box-shadow:0 0 8px #00f5ff30}50%{border-color:var(--cyan);box-shadow:0 0 20px #00f5ff60}}

.online-player-row{display:flex;align-items:center;gap:0.8rem;padding:0.7rem 0.8rem;background:var(--card2);border:1px solid rgba(255,255,255,0.06);border-radius:1rem;margin-bottom:0.5rem;transition:all .2s;}
.online-player-row:last-child{margin-bottom:0;}
.online-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex-shrink:0;animation:dotBlink 1.5s ease-in-out infinite;}
@keyframes dotBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}
.online-waiting-dot{background:#ffd700;box-shadow:0 0 8px #ffd700;}

.online-badge{display:inline-flex;align-items:center;gap:0.3rem;background:linear-gradient(135deg,var(--green),#00cc6a);border-radius:2rem;padding:0.2rem 0.8rem;font-size:0.7rem;font-weight:900;color:#000;}
.host-badge{background:linear-gradient(135deg,var(--gold),#cc9900);color:#000;border-radius:2rem;padding:0.15rem 0.6rem;font-size:0.7rem;font-weight:900;}

.name-input,.code-input{background:var(--card2);border:2px solid rgba(255,255,255,0.12);border-radius:1rem;padding:0.8rem 1rem;color:white;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:700;width:100%;margin-bottom:0.7rem;outline:none;text-align:center;-webkit-appearance:none;}
.name-input:focus{border-color:var(--cyan);box-shadow:0 0 15px #00f5ff25;}
.code-input{font-size:2rem;letter-spacing:0.3rem;text-transform:uppercase;color:var(--cyan);border-color:var(--cyan)40;}
.code-input:focus{border-color:var(--cyan);box-shadow:0 0 20px #00f5ff30;}
.code-input::placeholder{color:#333;font-size:1rem;letter-spacing:0;}

.online-status-bar{background:linear-gradient(135deg,rgba(0,245,255,0.08),rgba(176,64,255,0.08));border:1px solid var(--cyan)20;border-radius:1rem;padding:0.7rem 1rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:0.8rem;}

.connection-spinner{width:20px;height:20px;border:2px solid rgba(0,245,255,0.2);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}

.online-hero{background:linear-gradient(135deg,rgba(0,245,255,0.06),rgba(176,64,255,0.06),rgba(255,45,85,0.06));border:1px solid rgba(255,255,255,0.06);border-radius:1.5rem;padding:1.5rem 1rem;text-align:center;margin-bottom:1rem;position:relative;overflow:hidden;}
.online-hero::before{content:'';position:absolute;top:-100%;left:-100%;width:300%;height:300%;background:conic-gradient(transparent 0deg,rgba(0,245,255,0.05) 30deg,transparent 60deg);animation:heroSpin 12s linear infinite;}
@keyframes heroSpin{to{transform:rotate(360deg)}}
.online-globe{font-size:3.5rem;animation:globeFloat 3s ease-in-out infinite;}
@keyframes globeFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.05)}}

.mode-card{background:var(--card2);border-radius:1.2rem;padding:1.1rem;margin-bottom:0.7rem;cursor:pointer;border:1px solid rgba(255,255,255,0.07);transition:all .2s;position:relative;overflow:hidden;}
.mode-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.04),transparent);pointer-events:none;}
.mode-card:active{transform:scale(0.97);}
.mode-card:hover{border-color:rgba(255,255,255,0.15);}
.mode-card.create-card{border-color:var(--cyan)30;}
.mode-card.create-card:hover{box-shadow:var(--glow-cyan);}
.mode-card.join-card{border-color:var(--accent)30;}
.mode-card.join-card:hover{box-shadow:var(--glow-accent);}

.voted-overlay{position:absolute;inset:0;background:rgba(0,255,135,0.12);border-radius:1rem;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1;font-size:1.5rem;}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div id="appRoot"></div>
<script>
// ═══════════════════════════════════════════
// 🎮 PARTICLES

const pCanvas=document.getElementById('particles');
const pCtx=pCanvas.getContext('2d');
let pParticles=[];
function resizeCanvas(){pCanvas.width=window.innerWidth;pCanvas.height=window.innerHeight;}
resizeCanvas();window.addEventListener('resize',resizeCanvas);
class Particle{
  constructor(x,y,color,type='circle'){
    this.x=x||Math.random()*pCanvas.width;this.y=y||Math.random()*pCanvas.height;
    this.vx=(Math.random()-0.5)*(type==='burst'?8:0.3);
    this.vy=(Math.random()-0.5)*(type==='burst'?8:0.3)-(type==='burst'?3:0);
    this.alpha=type==='burst'?1:Math.random()*0.4+0.1;
    this.size=type==='burst'?Math.random()*6+3:Math.random()*2+0.5;
    this.color=color||`hsl(${Math.random()*360},100%,70%)`;
    this.gravity=type==='burst'?0.15:0;this.life=1;
    this.decay=type==='burst'?0.02:0.003;this.type=type;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.gravity;this.life-=this.decay;this.alpha=this.life;}
  draw(){pCtx.save();pCtx.globalAlpha=this.alpha;pCtx.fillStyle=this.color;pCtx.beginPath();pCtx.arc(this.x,this.y,this.size,0,Math.PI*2);pCtx.fill();pCtx.restore();}
}
function spawnBurst(x,y,count=40,colors=['#ff2d55','#ffd700','#00f5ff','#b040ff']){
  for(let i=0;i<count;i++) pParticles.push(new Particle(x,y,colors[Math.floor(Math.random()*colors.length)],'burst'));
}
for(let i=0;i<30;i++) pParticles.push(new Particle());
function animateParticles(){
  requestAnimationFrame(animateParticles);pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  pParticles=pParticles.filter(p=>p.life>0);
  while(pParticles.filter(p=>p.type==='circle').length<30) pParticles.push(new Particle());
  pParticles.forEach(p=>{p.update();p.draw();});
}
animateParticles();

let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(freq,dur,type='sine',vol=0.3){
  try{const ac=getAudio();const o=ac.createOscillator();const g=ac.createGain();
    o.connect(g);g.connect(ac.destination);o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    o.start();o.stop(ac.currentTime+dur);}catch(e){}
}

  if(!G.missions)G.missions={vote10:0,streak5:0,play5:0,daily3:0};
  if(!G.missionsDone)G.missionsDone=[];
  if(!G.eliminatedPlayers)G.eliminatedPlayers=[];

  }

}

function getQ(){
  if(Math.random()<0.05)return{text:LEGENDARY_Q[Math.floor(Math.random()*LEGENDARY_Q.length)],rarity:'legendary'};
  if(Math.random()<0.12)return{text:BONUS_Q[Math.floor(Math.random()*BONUS_Q.length)],rarity:'epic'};
  let list=QUESTIONS[G.currentCat]||QUESTIONS.friends;
  let used=G.usedQ[G.currentCat]||[];
  let avail=list.filter(q=>!used.includes(q));
  if(!avail.length){G.usedQ[G.currentCat]=[];avail=list;}
  let q=avail[Math.floor(Math.random()*avail.length)];
  if(!G.usedQ[G.currentCat])G.usedQ[G.currentCat]=[];
  G.usedQ[G.currentCat].push(q);
  return{text:q,rarity:'common'};
}
function getRankLabel(lvl){
  let keys=Object.keys(RANKS).map(Number).sort((a,b)=>b-a);
  for(let k of keys)if(lvl>=k)return RANKS[k];
  return RANKS[1];
}
function addXP(player,amount){
  let xp=(G.xp[player]||0)+amount;let lvl=G.levels[player]||1;let gained=0;
  while(xp>=lvl*100){xp-=lvl*100;lvl++;gained++;}
  G.xp[player]=xp;
  if(gained>0){
    G.levels[player]=lvl;let reward=lvl*75;
    G.scores[player]=(G.scores[player]||0)+reward;
    G.gems[player]=(G.gems[player]||0)+lvl*10;
    showLevelUp(player,lvl,reward);playLevelUp();
  }
  if(!isOnlineMode)saveG();
}

function createRoom(playerName){
  myPlayerName=playerName;
  const code=generateCode();
  roomCode=code;
  showOnlineConnecting('جاري إنشاء الغرفة...');
  peer=new Peer(getPeerId(code),{debug:0});
  peer.on('open',(id)=>{
    isOnlineMode=true;isHost=true;onlineGameStarted=false;
    onlinePlayers=[{name:playerName,peerId:id,isHost:true}];
    playOnline();renderOnlineWaiting();
  });
  peer.on('error',(err)=>{
    if(err.type==='unavailable-id'){
      peer.destroy();peer=null;createRoom(playerName);
    } else {
      showToast('❌ خطأ في الاتصال: '+err.type,'#ff2d55');
      screen='online-create';render();
    }
  });
  peer.on('connection',(conn)=>{
    conn.on('open',()=>{
      connections.push(conn);
      conn.on('data',(data)=>handleHostReceive(data,conn));
      conn.on('close',()=>{
        connections=connections.filter(c=>c!==conn);
        onlinePlayers=onlinePlayers.filter(p=>p.peerId!==conn.peer);
        broadcastToAll({type:'ROOM_UPDATE',players:onlinePlayers});
        if(onlineGameStarted)renderOnlineGame();else renderOnlineWaiting();
      });
      // If game already started, reject
      if(onlineGameStarted){conn.send({type:'ROOM_FULL'});}
    });
  });
}

function joinRoom(code,playerName){
  myPlayerName=playerName;
  showOnlineConnecting('جاري الاتصال بالغرفة...');
  peer=new Peer(null,{debug:0});
  let connected=false;
  let timeout=setTimeout(()=>{
    if(!connected){showToast('❌ لم يتم العثور على الغرفة. تحقق من الكود','#ff2d55');peer&&peer.destroy();peer=null;screen='online-join';render();}
  },12000);
  peer.on('open',(myId)=>{
    const conn=peer.connect(getPeerId(code.toUpperCase()),{reliable:true});
    conn.on('open',()=>{
      clearTimeout(timeout);connected=true;hostConn=conn;isOnlineMode=true;isHost=false;
      conn.send({type:'JOIN',name:playerName,peerId:myId});
      conn.on('data',(data)=>handleGuestReceive(data));
      conn.on('close',()=>{showToast('⚠️ انقطع الاتصال بالمضيف','#ff7c00');leaveRoom();});
      playOnline();showToast('✅ اتصلت بالغرفة!','#00ff87');
    });
    conn.on('error',()=>{clearTimeout(timeout);showToast('❌ تعذر الاتصال. تحقق من الكود','#ff2d55');screen='online-join';render();});
  });
  peer.on('error',()=>{clearTimeout(timeout);showToast('❌ خطأ في الشبكة','#ff2d55');screen='online-join';render();});
}

function broadcastToAll(data){connections.forEach(c=>{try{if(c.open)c.send(data);}catch(e){}});}

function broadcastState(){
  broadcastToAll({type:'GAME_STATE',g:JSON.parse(JSON.stringify(G)),q:currentQ});
}

function broadcastToast(msg,color){broadcastToAll({type:'TOAST',msg,color});}

function handleHostReceive(data,conn){
  if(data.type==='JOIN'){
    if(onlineGameStarted){conn.send({type:'ROOM_FULL'});return;}
    onlinePlayers.push({name:data.name,peerId:data.peerId,isHost:false});
    broadcastToAll({type:'ROOM_UPDATE',players:onlinePlayers});
    renderOnlineWaiting();
  } else if(data.type==='VOTE'){
    processVote(data.player);
  }
}

function handleGuestReceive(data){
  if(data.type==='ROOM_UPDATE'){
    onlinePlayers=data.players;
    if(!onlineGameStarted)renderOnlineWaiting();
  } else if(data.type==='GAME_START'){
    onlineGameStarted=true;votedThisRound=false;
    G=data.g;currentQ=data.q;rebuildQ();renderOnlineGame();
  } else if(data.type==='GAME_STATE'){
    G=data.g;currentQ=data.q;votedThisRound=false;renderOnlineGame();
  } else if(data.type==='TOAST'){
    showToast(data.msg,data.color);
  } else if(data.type==='ROOM_FULL'){
    showToast('❌ الغرفة ممتلئة أو اللعبة بدأت','#ff2d55');
    peer&&peer.destroy();peer=null;isOnlineMode=false;screen='online';render();
  } else if(data.type==='KICKED'){
    showToast('🚫 تم طردك من الغرفة','#ff2d55');leaveRoom();
  }
}

function startOnlineGame(){
  G.players=onlinePlayers.map(p=>p.name);
  G.scores={};G.gems={};G.votes={};G.challengesDone={};G.achievements={};
  G.levels={};G.xp={};G.streaks={};G.usedQ={};G.extraUnlocked={};
  for(let p of G.players){G.scores[p]=0;G.gems[p]=0;G.votes[p]=0;G.challengesDone[p]=0;G.achievements[p]=[];G.levels[p]=1;G.xp[p]=0;G.streaks[p]=0;}
  for(let c of CAT_ORDER){G.usedQ[c]=[];G.extraUnlocked[c]=false;}
  G.totalGames=0;G.totalVotes=0;G.comboMult=1;G.comboOwner=null;G.lastWinner=null;G.maxStreak=0;
  G.currentEvent=null;G.eventLeft=0;G.eliminatedPlayers=[];G.immunePlayer=null;
  G.missions={vote10:0,streak5:0,play5:0,daily3:0};G.missionsDone=[];
  rebuildQ();onlineGameStarted=true;
  G.currentTarget=G.players[Math.floor(Math.random()*G.players.length)];
  currentQ=getQ();
  broadcastToAll({type:'GAME_START',g:JSON.parse(JSON.stringify(G)),q:currentQ});
  spawnBurst(window.innerWidth/2,window.innerHeight/2,60);
  renderOnlineGame();
}

function processVote(player){
  // Host only - process a vote for player
  if(G.eliminatedPlayers.includes(player)){showToast(`⛔ ${player} خارج من اللعب!`);return;}
  vibrate([20]);playVote();
  let basePoints=10;let mult=G.comboMult;
  if(G.currentEvent?.id==='double')mult*=2;
  if(G.currentEvent?.id==='jackpot')mult=3;
  let points=basePoints*mult;
  let jackpot=Math.random()<0.1;
  if(jackpot){points*=3;flashJackpot();showToast(`🎰 JACKPOT! ${player} +${points} نقطة`,'#ffd700',3000);broadcastToast(`🎰 JACKPOT! ${player}!`,'#ffd700');}
  else{showToast(`😂 ${player} +${points} نقطة`,'#00ff87');broadcastToast(`😂 ${player} +${points} نقطة`,'#00ff87');}
  if(G.immunePlayer===player){showToast(`🛡️ ${player} محمي!`,'#b040ff');broadcastToast(`🛡️ ${player} محمي!`,'#b040ff');}
  else{
    G.votes[player]=(G.votes[player]||0)+1;G.scores[player]=(G.scores[player]||0)+points;
    G.totalVotes=(G.totalVotes||0)+1;
    addXP(player,Math.floor(points/2));
    if(player===G.lastWinner){
      G.streaks[player]=(G.streaks[player]||0)+1;
      if(G.streaks[player]>=(G.maxStreak||0))G.maxStreak=G.streaks[player];
      if(G.streaks[player]>=3&&G.comboMult<4){G.comboMult=Math.min(4,G.comboMult+1);G.comboOwner=player;G.comboLeft=5;showToast(`🔥 COMBO x${G.comboMult}! ${player} في حالة!`,'#ff7c00');broadcastToast(`🔥 COMBO x${G.comboMult}!`,'#ff7c00');}
    } else {
      G.streaks[player]=1;if(G.lastWinner)G.streaks[G.lastWinner]=Math.max(0,(G.streaks[G.lastWinner]||1)-1);
      if(G.comboMult>1){G.comboMult=1;G.comboOwner=null;}
    }
    G.lastWinner=player;
    if(G.currentEvent?.id==='steal'){
      let sorted=[...G.players].filter(p=>!G.eliminatedPlayers.includes(p)).sort((a,b)=>(G.scores[b]||0)-(G.scores[a]||0));
      if(sorted.length>=2){let top=sorted[0];let bottom=sorted[sorted.length-1];let stolen=Math.min(50,G.scores[top]||0);G.scores[top]-=stolen;G.scores[bottom]+=stolen;showToast(`💀 سرقة! ${top} ← ${stolen} نقطة → ${bottom}`,'#ff2d55',3000);}
      G.currentEvent=null;
    }
    if(G.currentEvent?.id==='immunity'){
      let sorted2=[...G.players].filter(p=>!G.eliminatedPlayers.includes(p)).sort((a,b)=>(G.scores[a]||0)-(G.scores[b]||0));
      if(sorted2.length>0){G.immunePlayer=sorted2[0];showToast(`🛡️ ${G.immunePlayer} محمي!`,'#b040ff');}
      G.currentEvent=null;
    }
    if(G.currentEvent&&G.currentEvent.duration>0){G.eventLeft--;if(G.eventLeft<=0)G.currentEvent=null;}
    G.missions.vote10=Math.min(G.totalVotes,10);checkMissions();
  }
  G.currentTarget=G.players[Math.floor(Math.random()*G.players.length)];
  currentQ=getQ();G.totalGames++;maybeSpawnEvent();G.missions.play5=Math.min(G.totalGames,5);
  spawnBurst(window.innerWidth/2,window.innerHeight*.6,20,[CATS[G.currentCat].color,'#fff','var(--gold)']);
  broadcastState();
  renderOnlineGame();
}

function kickPlayer(peerId){
  let conn=connections.find(c=>c.peer===peerId);
  if(conn){try{conn.send({type:'KICKED'});}catch(e){}conn.close();}
  onlinePlayers=onlinePlayers.filter(p=>p.peerId!==peerId);
  connections=connections.filter(c=>c.peer!==peerId);
  broadcastToAll({type:'ROOM_UPDATE',players:onlinePlayers});
  renderOnlineWaiting();
}

function copyRoomCode(){
  try{navigator.clipboard.writeText(roomCode);showToast(`📋 تم نسخ الكود: ${roomCode}`,'#00ff87');}

}

function leaveRoom(){

function refreshGame(){playClick();G.totalGames++;maybeSpawnEvent();G.missions.play5=Math.min(G.totalGames,5);saveG();renderGame();}

function castVote(player){
  if(G.eliminatedPlayers.includes(player)){showToast("⛔ هذا اللاعب خارج من اللعب!");return;}
  vibrate([20]);playVote();
  let basePoints=10;let mult=G.comboMult;
  if(G.currentEvent?.id==='double')mult*=2;if(G.currentEvent?.id==='jackpot')mult=3;
  let points=basePoints*mult;
  let jackpot=Math.random()<0.1;
  if(jackpot){points*=3;flashJackpot();showToast(`🎰 JACKPOT! ${player} +${points} نقطة`,'#ffd700',3000);vibrate([100,50,100]);}
  else showToast(`😂 ${player} +${points} نقطة`,'#00ff87');
  if(G.immunePlayer===player){showToast(`🛡️ ${player} محمي!`,'#b040ff');}
  else{
    G.votes[player]=(G.votes[player]||0)+1;G.scores[player]=(G.scores[player]||0)+points;G.totalVotes=(G.totalVotes||0)+1;
    addXP(player,Math.floor(points/2));
    if(player===G.lastWinner){
      G.streaks[player]=(G.streaks[player]||0)+1;
      if(G.streaks[player]>=(G.maxStreak||0))G.maxStreak=G.streaks[player];
      if(G.streaks[player]>=3&&G.comboMult<4){G.comboMult=Math.min(4,G.comboMult+1);G.comboOwner=player;G.comboLeft=5;showToast(`🔥 COMBO x${G.comboMult}! ${player} في حالة!`,'#ff7c00');vibrate([50,30,50,30,50]);}
    } else {
      G.streaks[player]=1;if(G.lastWinner)G.streaks[G.lastWinner]=Math.max(0,(G.streaks[G.lastWinner]||1)-1);
      if(G.comboMult>1){G.comboMult=1;showToast("💔 انكسر الـ combo!");}
    }
    G.lastWinner=player;
    if(G.currentEvent?.id==='steal'){
      let s=[...G.players].filter(p=>!G.eliminatedPlayers.includes(p)).sort((a,b)=>(G.scores[b]||0)-(G.scores[a]||0));
      if(s.length>=2){let top=s[0];let bot=s[s.length-1];let st=Math.min(50,G.scores[top]||0);G.scores[top]-=st;G.scores[bot]+=st;showToast(`💀 سرقة! ${top} ← ${st} نقطة → ${bot}`,'#ff2d55',3000);}
      G.currentEvent=null;
    }
    if(G.currentEvent?.id==='immunity'){
      let s2=[...G.players].filter(p=>!G.eliminatedPlayers.includes(p)).sort((a,b)=>(G.scores[a]||0)-(G.scores[b]||0));
      if(s2.length>0){G.immunePlayer=s2[0];showToast(`🛡️ ${G.immunePlayer} محمي!`,'#b040ff');}
      G.currentEvent=null;
    }
    if(G.currentEvent&&G.currentEvent.duration>0){G.eventLeft--;if(G.eventLeft<=0)G.currentEvent=null;}
    G.missions.vote10=Math.min(G.totalVotes,10);G.missions.streak5=Math.min(G.maxStreak||0,5);checkMissions();saveG();
  }
  spawnBurst(window.innerWidth/2,window.innerHeight*.6,20,[CATS[G.currentCat].color,'#fff','var(--gold)']);
  setTimeout(()=>renderGame(),300);
}

  app.innerHTML=`
    <div class="top-header"><div class="logo">🎯 المهمات والإنجازات</div></div>
    <div class="card"><div class="section-title">📅 مهمات يومية</div>${missionItems}
      <div style="color:#444;font-size:0.7rem;text-align:center;margin-top:0.5rem">${G.dailyStreak||1} يوم متتالي 🔥</div>
    </div>
    <div class="card card-glow-gold">
      <div class="section-title">🔮 أحداث عشوائية</div>
      ${EVENTS.map(e=>`<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem">
        <span style="font-size:1.2rem">${e.emoji}</span>
        <div><div style="font-size:0.85rem;font-weight:700">${e.title}</div><div style="color:#555;font-size:0.75rem">${e.desc}</div></div>
      </div>`).join('')}
    </div>
    ${renderBottomNav()}`;
}

// ═══════════════════════════════════════════
function renderPlayers(){
  activeTab='players';
  let fields=G.players.map((p,i)=>`
    <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem">
      <span style="font-size:1rem;width:1.5rem;color:#555">${i+1}</span>
      <input id="pn_${i}" value="${p}" style="flex:1;background:#0d0d20;border:1px solid rgba(255,255,255,0.1);border-radius:2rem;padding:0.5rem 1rem;color:white;font-family:Tajawal,sans-serif;font-size:0.9rem;text-align:center">
      <button onclick="delPlayer(${i})" style="background:rgba(255,45,85,0.2);border:1px solid var(--accent)40;border-radius:50%;width:32px;height:32px;color:var(--accent)">✕</button>
    </div>`).join('');
  app.innerHTML=`
    <div class="top-header"><div class="logo">👥 اللاعبون</div><span style="color:#555;font-size:0.85rem">${G.players.length}/10</span></div>
    <div class="card">${fields}
      <button onclick="addPlayer()" class="btn-primary" style="background:linear-gradient(135deg,var(--green),#00cc66);margin-top:0.5rem" ${G.players.length>=10?'disabled':''}>➕ إضافة لاعب</button>
    </div>
    <button onclick="savePlayers()" class="btn-primary">💾 حفظ التغييرات</button>
    ${renderBottomNav()}`;
}
function addPlayer(){
  if(G.players.length>=10){showToast("الحد 10 لاعبين",'#ff2d55');return;}
  let pn=`لاعب ${G.players.length+1}`;G.players.push(pn);
  ['scores','gems','votes','challengesDone','levels','xp','streaks'].forEach(k=>G[k][pn]=k==='levels'?1:0);
  G.achievements[pn]=[];saveG();renderPlayers();
}
function delPlayer(idx){
  if(G.players.length<=2){showToast("يجب بقاء لاعبين على الأقل");return;}
  let removed=G.players.splice(idx,1)[0];
  ['scores','gems','votes','challengesDone','achievements','levels','xp','streaks'].forEach(k=>delete G[k][removed]);
  saveG();renderPlayers();
}
function savePlayers(){
  for(let i=0;i<G.players.length;i++){
    let inp=document.getElementById(`pn_${i}`);
    if(inp&&inp.value&&inp.value!==G.players[i]){
      let old=G.players[i];let nn=inp.value.trim();G.players[i]=nn;
      ['scores','gems','votes','challengesDone','achievements','levels','xp','streaks'].forEach(k=>{G[k][nn]=G[k][old];delete G[k][old];});
    }
  }
  saveG();showToast("✅ تم الحفظ",'#00ff87');screen='home';activeTab='home';render();
}
function resetScores(){
  if(!confirm("إعادة تعيين كل النقاط؟"))return;
  G.players.forEach(p=>{G.scores[p]=0;G.votes[p]=0;G.streaks[p]=0;G.gems[p]=0;G.achievements[p]=[];G.levels[p]=1;G.xp[p]=0;});
  G.comboMult=1;G.lastWinner=null;G.totalGames=0;G.totalVotes=0;G.missionsDone=[];G.missions={vote10:0,streak5:0,play5:0,daily3:0};G.eliminatedPlayers=[];
  saveG();showToast("🔄 تم الإعادة",'#ff2d55');renderLeaderboard();
}

function mkModal(inner){let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-box">${inner}</div>`;document.body.appendChild(m);return m;}

function showChallenge(){
  playClick();
  let ch=CHALLENGES[Math.floor(Math.random()*CHALLENGES.length)];
  let pts=50*G.comboMult;
  mkModal(`<div class="text-center">
    <div style="font-size:0.9rem;color:#555;margin-bottom:0.5rem">🎭 تحدي!</div>
    <div style="font-size:1.3rem;font-weight:900;margin-bottom:1rem">${ch}</div>
    <div style="color:var(--gold);margin-bottom:1rem">⭐ المكافأة: ${pts} نقطة</div>
    <div style="display:flex;gap:0.5rem;justify-content:center">
      <button onclick="completeChallenge(${pts},this)" class="btn-primary" style="width:auto;padding:0.6rem 1.4rem">✅ تم!</button>
      <button onclick="this.closest('.modal').remove()" style="background:rgba(255,255,255,0.08);border-radius:3rem;padding:0.6rem 1.4rem;color:white">إلغاء</button>
    </div>
  </div>`);
}
function completeChallenge(pts,btn){
  G.challengesDone[G.currentTarget]=(G.challengesDone[G.currentTarget]||0)+1;
  G.scores[G.currentTarget]=(G.scores[G.currentTarget]||0)+pts;
  addXP(G.currentTarget,Math.floor(pts/2));
  if(isOnlineMode&&isHost){broadcastState();}else saveG();
  showToast(`🎭 ${G.currentTarget} +${pts} نقطة`,'#00ff87');
  if(isOnlineMode&&isHost)broadcastToast(`🎭 ${G.currentTarget} +${pts} نقطة!`,'#00ff87');
  btn.closest('.modal').remove();
  if(isOnlineMode)renderOnlineGame();else renderGame();
}

function showDice(){
  playClick();
  let today=new Date().toISOString().slice(0,10);
  if(G.lastDiceDate===today){showToast("⏰ النرد مرة واحدة يومياً!",'#ff2d55');return;}
  G.lastDiceDate=today;
  let faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
  let result=Math.floor(Math.random()*6)+1;
  let pts=result*30*G.comboMult;let special='';
  if(result===6){pts+=200;special='🎉 +200 إضافية! AMAZING!';flashJackpot();}
  else if(result===1){pts=15;special='😅 حظ سيئ! 15 نقطة فقط';}
  G.scores[G.currentTarget]=(G.scores[G.currentTarget]||0)+pts;
  addXP(G.currentTarget,Math.floor(pts/2));
  if(!isOnlineMode)saveG();playDice();
  mkModal(`<div class="text-center">
    <div style="font-size:4rem;margin:0.5rem 0;animation:crownFloat 1s ease-in-out infinite">${faces[result-1]}</div>
    <div style="font-size:2rem;font-weight:900">${result}</div>
    <div style="color:var(--green);font-size:1.1rem;margin:0.5rem 0">+${pts} نقطة</div>
    ${special?`<div style="color:var(--gold);font-size:0.9rem">${special}</div>`:''}
    <button onclick="this.closest('.modal').remove();${isOnlineMode?'renderOnlineGame()':'renderGame()'};" class="btn-primary" style="margin-top:1rem">متابعة 🎮</button>
  </div>`);
}

function showSpin(){
  playClick();
  let today=new Date().toISOString().slice(0,10);
  if(G.lastSpinDate===today){showToast("⏰ العجلة مرة واحدة يومياً!",'#ff2d55');return;}
  let m=mkModal(`<div class="text-center">
    <div style="font-size:1rem;font-weight:900;margin-bottom:1rem;color:var(--gold)">🎡 عجلة الحظ</div>
    <canvas id="wheelCanvas" width="230" height="230" style="border-radius:50%;display:block;margin:0 auto;cursor:pointer"></canvas>
    <button id="spinBtn" class="btn-primary" style="margin-top:1rem">🎯 أدوّر!</button>
  </div>`);
  setTimeout(()=>{drawWheel(0);document.getElementById('spinBtn').onclick=()=>doSpin(m);},100);
}
function drawWheel(angle){
  const canvas=document.getElementById('wheelCanvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');const cx=115,cy=115,r=110;
  const slices=SPIN_PRIZES.length;const sa=2*Math.PI/slices;
  ctx.clearRect(0,0,230,230);
  for(let i=0;i<slices;i++){
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,angle+i*sa,angle+(i+1)*sa);ctx.closePath();
    ctx.fillStyle=SPIN_PRIZES[i].color;ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(angle+(i+0.5)*sa);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 11px Tajawal,sans-serif';
    ctx.fillText(SPIN_PRIZES[i].label,r-8,4);ctx.restore();
  }
  ctx.beginPath();ctx.moveTo(cx+r+5,cy);ctx.lineTo(cx+r-15,cy-8);ctx.lineTo(cx+r-15,cy+8);ctx.closePath();ctx.fillStyle='#ff2d55';ctx.fill();
}
function doSpin(modal){
  let spinBtn=document.getElementById('spinBtn');if(spinBtn)spinBtn.disabled=true;
  let today=new Date().toISOString().slice(0,10);G.lastSpinDate=today;
  let targetIdx=Math.floor(Math.random()*SPIN_PRIZES.length);
  let spins=5+Math.random()*5;let totalAngle=spins*2*Math.PI+(2*Math.PI*(SPIN_PRIZES.length-targetIdx)/SPIN_PRIZES.length);
  let startTime=null;let dur=3000;let startAngle=0;
  function animSpin(ts){
    if(!startTime)startTime=ts;let t=Math.min((ts-startTime)/dur,1);let eased=1-Math.pow(1-t,3);
    let angle=startAngle+totalAngle*eased;drawWheel(angle);
    if(t<1){requestAnimationFrame(animSpin);}
    else{
      let prize=SPIN_PRIZES[targetIdx];
      G.scores[G.currentTarget]=(G.scores[G.currentTarget]||0)+prize.points;
      if(prize.bonus==='x2')G.comboMult=2;
      addXP(G.currentTarget,Math.floor(prize.points/2));
      if(!isOnlineMode)saveG();
      if(prize.label.includes('JACKPOT'))flashJackpot();
      mkModal(`<div class="text-center">
        <div style="font-size:3rem;margin:0.5rem 0">🎡</div>
        <div style="font-size:1.5rem;font-weight:900;color:${prize.color}">${prize.label}</div>
        ${prize.points?`<div style="color:var(--green);margin-top:0.5rem">+${prize.points} نقطة</div>`:''}
        ${prize.bonus?`<div style="color:var(--cyan);margin-top:0.5rem">${prize.bonus} مفعّل!</div>`:''}
        <button onclick="this.closest('.modal').remove();${isOnlineMode?'renderOnlineGame()':'renderGame()'};" class="btn-primary" style="margin-top:1rem">رائع! 🎉</button>
      </div>`);
      modal.remove();spawnBurst(window.innerWidth/2,window.innerHeight/2,50);
    }
  }
  requestAnimationFrame(animSpin);
}

function showEliminationMode(){
  playClick();
  let eligible=G.players.filter(p=>!G.eliminatedPlayers.includes(p));
  let sorted=[...eligible].sort((a,b)=>(G.scores[a]||0)-(G.scores[b]||0));
  let loser=sorted[0];let loserScore=G.scores[loser]||0;
  let punishment=CHALLENGES[Math.floor(Math.random()*CHALLENGES.length)];
  mkModal(`<div class="text-center">
    <div style="color:var(--accent);font-size:1.2rem;font-weight:900;margin-bottom:0.5rem">💀 وضع الإقصاء!</div>
    <div class="punishment-card">
      <div style="font-size:1rem;margin-bottom:0.5rem">الأخير في الترتيب:</div>
      <div style="font-size:1.4rem;font-weight:900;color:var(--accent)">${loser}</div>
      <div style="font-size:0.85rem;color:#aaa">${loserScore} نقطة</div>
    </div>
    <div style="margin:1rem 0;padding:0.8rem;background:rgba(255,45,85,0.1);border-radius:1rem">
      <div style="font-size:0.8rem;color:#555;margin-bottom:0.4rem">العقوبة:</div>
      <div style="font-weight:700">${punishment}</div>
    </div>
    <div style="display:flex;gap:0.5rem;justify-content:center">
      <button onclick="eliminatePlayer('${loser}',this)" style="background:linear-gradient(135deg,#ff2d55,#c00020);border-radius:3rem;padding:0.6rem 1.2rem;color:white;font-weight:900;font-family:Tajawal,sans-serif">💀 إقصاء</button>
      <button onclick="this.closest('.modal').remove()" style="background:rgba(255,255,255,0.08);border-radius:3rem;padding:0.6rem 1.2rem;color:white;font-family:Tajawal,sans-serif">إلغاء</button>
    </div>
    <button onclick="restoreAll(this)" style="margin-top:0.5rem;background:rgba(0,255,135,0.1);border:1px solid var(--green)40;border-radius:3rem;padding:0.4rem 1rem;color:var(--green);font-family:Tajawal,sans-serif;font-size:0.8rem;width:100%">↩️ استعادة جميع اللاعبين</button>
  </div>`);
}
function eliminatePlayer(p,btn){G.eliminatedPlayers.push(p);saveG();showToast(`💀 ${p} خرج من اللعب!`,'#ff2d55');btn.closest('.modal').remove();renderGame();}
function restoreAll(btn){G.eliminatedPlayers=[];saveG();showToast("✅ تم استعادة الجميع",'#00ff87');btn.closest('.modal').remove();}

function showAdModal(){
  playClick();
  if(G.extraUnlocked[G.currentCat]){showToast("✅ هذه الفئة مفتوحة بالفعل!");return;}
  let timer=30;
  let m=mkModal(`<div class="text-center">
    <div style="font-size:1rem;font-weight:900;margin-bottom:0.8rem;color:var(--gold)">📺 إعلان</div>
    <div id="adTimerNum" style="font-size:3.5rem;font-weight:900;color:var(--cyan)">30</div>
    <div style="color:#555;font-size:0.85rem;margin-bottom:0.8rem">شاهد للحصول على المكافأة</div>
    <div class="xp-track" style="height:8px;margin-bottom:1rem"><div id="adProg" class="xp-fill" style="width:0%"></div></div>
    <div style="color:#aaa;font-size:0.85rem">💎 +500 جوهرة<br>📚 +أسئلة جديدة لـ ${CATS[G.currentCat].label}</div>
    <button id="adClose" class="btn-primary" style="margin-top:1rem;display:none">🎁 استلام المكافأة!</button>
  </div>`);
  let iv=setInterval(()=>{
    timer--;let tEl=document.getElementById('adTimerNum');let pEl=document.getElementById('adProg');let cEl=document.getElementById('adClose');
    if(!tEl){clearInterval(iv);return;}
    tEl.textContent=timer;if(pEl)pEl.style.width=((30-timer)/30*100)+'%';
    if(timer<=0){
      clearInterval(iv);if(tEl)tEl.textContent='✅';
      G.gems[G.currentTarget]=(G.gems[G.currentTarget]||0)+500;G.extraUnlocked[G.currentCat]=true;rebuildQ();G.usedQ[G.currentCat]=[];saveG();
      showToast(`🎉 فتحت أسئلة جديدة لـ ${CATS[G.currentCat].label}!`,'#00ff87',3000);showToast('💎 +500 جوهرة!','#ffd700');
      if(cEl){cEl.style.display='block';cEl.onclick=()=>{m.remove();renderGame();};}
    }
  },1000);
}

function showSettingsMenu(){
  playClick();
  let m=mkModal(`<div>
    <div style="font-size:1.1rem;font-weight:900;text-align:center;margin-bottom:1rem;color:var(--accent)">📋 الإعدادات</div>
    <div onclick="gotoTab('players');this.closest('.modal').remove()" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:1rem;padding:0.8rem;display:flex;align-items:center;gap:0.7rem;cursor:pointer;margin-bottom:0.5rem">

}
function showStats(){
  let total=Object.values(G.scores).reduce((s,v)=>s+v,0);

function showPrivacy(){
