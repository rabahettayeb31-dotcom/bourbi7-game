            padding: 1.2rem;
            transition: all 0.2s;

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
        @keyframes shake {
            0%,100%{ transform: translateX(0);}
            25%{ transform: translateX(-4px);}
            75%{ transform: translateX(4px);}
        }
        @keyframes confettiPop {
            0%{ transform: scale(0); opacity: 1;}
            100%{ transform: scale(1.5); opacity: 0;}
        }

            margin-bottom: 1rem;
            border: 1px solid rgba(255,255,255,0.05);

    function loadGame() {
        const saved = localStorage.getItem("chkoun_game");
        if(saved) {
            try {
                const data = JSON.parse(saved);
                for(let k in data) if(gameState.hasOwnProperty(k)) gameState[k] = data[k];
            } catch(e){}
        }
        // تهيئة البيانات الناقصة
        for(let p of gameState.players) {
            if(gameState.scores[p] === undefined) gameState.scores[p]=0;
            if(gameState.gems[p] === undefined) gameState.gems[p]=0;
            if(gameState.votes[p] === undefined) gameState.votes[p]=0;
            if(gameState.challengesDone[p] === undefined) gameState.challengesDone[p]=0;
            if(gameState.achievements[p] === undefined) gameState.achievements[p]=[];
            if(gameState.questionsAnswered[p] === undefined) gameState.questionsAnswered[p]=0;
            if(gameState.streak[p] === undefined) gameState.streak[p]=0;
            if(gameState.levels[p] === undefined) gameState.levels[p]=1;
            if(gameState.xp[p] === undefined) gameState.xp[p]=0;
        }
        if(!gameState.currentTarget) gameState.currentTarget = gameState.players[0];
        if(Object.keys(gameState.usedQuestions).length===0) {
            for(let c of CAT_ORDER) gameState.usedQuestions[c]=[];
        }
        if(!gameState.extraUnlocked) gameState.extraUnlocked = {};
        for(let c of CAT_ORDER) if(gameState.extraUnlocked[c]===undefined) gameState.extraUnlocked[c]=false;
        
        // إعادة بناء QUESTIONS بناءً على BASE_QUESTIONS والإضافات المفتوحة
        rebuildQuestions();
    }
    
    function rebuildQuestions() {
        for(let cat of CAT_ORDER) {
            QUESTIONS[cat] = [...BASE_QUESTIONS[cat]];
            if(gameState.extraUnlocked[cat]) {
                QUESTIONS[cat].push(...EXTRA_QUESTIONS_POOL);
            }
        }
    }
    
    function saveGame() {
        let toStore = {...gameState};
        localStorage.setItem("chkoun_game", JSON.stringify(toStore));
    }

    function addXP(player, amount) {
        let xp = (gameState.xp[player]||0)+amount;
        let lvl = gameState.levels[player]||1;
        let need = lvl*100;
        let gainedLevels = 0;
        while(xp >= need) {
            xp -= need;
            lvl++;
            need = lvl*100;
            gainedLevels++;
        }
        if(gainedLevels>0) {
            gameState.levels[player]=lvl;
            gameState.xp[player]=xp;
            let reward = lvl*50;
            gameState.scores[player] += reward;
            showToast(`🎉 ${player} وصل مستوى ${lvl}! +${reward} نقطة`, COLORS.gold);
            let rankKey = Object.keys(RANKS).filter(r=>r<=lvl).pop();
            if(rankKey && RANKS[rankKey]) showToast(`🏆 رتبة جديدة: ${RANKS[rankKey]}`, "#f1c40f");
        } else {
            gameState.xp[player]=xp;
        }
        saveGame();
    }

    function showToast(msg, bg="#e94560") {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        toast.style.backgroundColor = bg;
        document.body.appendChild(toast);
        setTimeout(()=>toast.remove(), 2200);
    }

    function checkAchievements(player) {
        let newAch = [];
        let votes = gameState.votes[player]||0;
        let score = gameState.scores[player]||0;
        if(votes>=1 && !gameState.achievements[player].includes("first_vote")) {
            newAch.push("first_vote");
            gameState.scores[player] += ACHIEVEMENTS_MAP.first_vote.points;
            showToast(`🏆 ${ACHIEVEMENTS_MAP.first_vote.name} +${ACHIEVEMENTS_MAP.first_vote.points}`, COLORS.gold);
        }
        if(votes>=5 && !gameState.achievements[player].includes("five_votes")) {
            newAch.push("five_votes");
            gameState.scores[player] += ACHIEVEMENTS_MAP.five_votes.points;
            showToast(`⭐ ${ACHIEVEMENTS_MAP.five_votes.name} +${ACHIEVEMENTS_MAP.five_votes.points}`, COLORS.gold);
        }
        if(score>=1000 && !gameState.achievements[player].includes("rich")) {
            newAch.push("rich");
            gameState.scores[player] += ACHIEVEMENTS_MAP.rich.points;
            showToast(`💰 ${ACHIEVEMENTS_MAP.rich.name} +${ACHIEVEMENTS_MAP.rich.points}`, COLORS.gold);
        }
        if(newAch.length) gameState.achievements[player].push(...newAch);
        saveGame();
    }

    function getRandomQuestion() {
        let list = QUESTIONS[gameState.currentCategory] || QUESTIONS.friends;
        let used = gameState.usedQuestions[gameState.currentCategory];
        let avail = list.filter(q=>!used.includes(q));
        if(avail.length===0) {
            gameState.usedQuestions[gameState.currentCategory]=[];
            avail = list;
        }
        let q = avail[Math.floor(Math.random()*avail.length)];
        gameState.usedQuestions[gameState.currentCategory].push(q);
        return q;
    }

    function openLootbox() {
        if(gameState.totalGames>0 && gameState.totalGames%5===0) {
            let rew = LOOT_REWARDS[Math.floor(Math.random()*LOOT_REWARDS.length)];
            if(rew.type==="points") {
                gameState.scores[gameState.currentTarget] += rew.value;
                showToast(`🎁 ${rew.emoji} ${gameState.currentTarget} حصل على ${rew.name}`, COLORS.gold);
            } else if(rew.type==="multiplier") {
                gameState.comboMult = rew.value;
                showToast(`🔥 ${rew.name} لمدة 3 جولات!`, COLORS.orange);
            }
            saveGame();
        }
    }

                    <div class="rank-badge mt-2">${Object.values(RANKS).find((v,i)=> champLevel>=Number(Object.keys(RANKS)[i]) ) || RANKS[1]}</div>
                </div>
                <button class="btn-primary" id="managePlayersBtn">👥 إدارة اللاعبين</button>
                <div class="text-gold mt-2">📂 اختر الفئة:</div>
                ${catsHtml}
                <button class="btn-primary" id="randomGameBtn" style="background:#f39c12; margin-top:0.5rem;">🎲 بداية عشوائية 🎲</button>
                <div class="flex-between mt-2">
                    <div class="text-center"><div>👥</div><div style="font-weight:bold">${gameState.players.length}</div><div class="text-dim">لاعب</div></div>
                    <div class="text-center"><div>🎮</div><div style="font-weight:bold">${gameState.totalGames}</div><div class="text-dim">لعبة</div></div>
                    <div class="text-center"><div>⭐</div><div style="font-weight:bold">${totalAchieve}</div><div class="text-dim">إنجاز</div></div>
                </div>
            </div>
        `;
        document.querySelectorAll('.category-btn').forEach(btn=>{
            btn.addEventListener('click', (e)=>{
                let cat = btn.dataset.cat;
                gameState.currentCategory = cat;
                gameState.totalGames++;
                saveGame();
                currentScreen = "game";
                render();
            });
        });
        document.getElementById('randomGameBtn').onclick = ()=>{
            let randCat = CAT_ORDER[Math.floor(Math.random()*CAT_ORDER.length)];
            gameState.currentCategory = randCat;
            gameState.totalGames++;
            saveGame();
            currentScreen = "game";
            render();
        };
        document.getElementById('managePlayersBtn').onclick = ()=>{ currentScreen="players"; render(); };
        document.getElementById('menuBtn').onclick = ()=> showSettingsMenu();
    }

    function renderPlayersScreen() {
        let fields = [];
        for(let i=0; i<gameState.players.length; i++) {
            fields.push(`
                <div class="flex-between" style="margin-bottom:0.6rem">
                    <span style="width:2rem">${i+1}</span>
                    <input id="pname_${i}" value="${gameState.players[i]}" style="flex:1; background:#1a1a2e; border:1px solid #e94560; border-radius:2rem; padding:0.5rem; color:white; text-align:center">
                    <button class="delPlayerBtn" data-idx="${i}" style="background:#ef476f; border-radius:2rem; padding:0.4rem 1rem; color:white;">🗑️</button>
                </div>
            `);
        }
        app.innerHTML = `
            <div class="animate-fade">
                <div class="flex-between">
                    <button id="backMainBtn" class="back-btn-large">← رجوع</button>
                    <h2 class="text-accent">👥 إدارة اللاعبين</h2>
                    <div style="width:2rem;"></div>
                </div>
                <div class="text-dim text-center">(2 إلى 10 لاعبين)</div>
                <hr>
                ${fields.join('')}
                <button id="addPlayerBtn" class="btn-primary" style="background:#06d6a0; margin-top:0.5rem;" ${gameState.players.length>=10 ? 'disabled' : ''}>➕ إضافة لاعب</button>
                <button id="savePlayersBtn" class="btn-primary mt-2">💾 حفظ</button>
                <button id="resetScoresBtn" class="btn-outline mt-2" style="color:#ef476f; border-color:#ef476f;">🔄 إعادة تعيين النقاط</button>
            </div>
        `;
        document.getElementById('backMainBtn').onclick = ()=>{ currentScreen="main"; render(); };
        document.getElementById('addPlayerBtn').onclick = ()=>{
            if(gameState.players.length<10) {
                gameState.players.push(`لاعب ${gameState.players.length+1}`);
                let newP = gameState.players[gameState.players.length-1];
                gameState.scores[newP]=0; 
                gameState.gems[newP]=0;
                gameState.votes[newP]=0; 
                gameState.challengesDone[newP]=0;
                gameState.achievements[newP]=[]; 
                gameState.levels[newP]=1; 
                gameState.xp[newP]=0;
                saveGame();
                renderPlayersScreen();
            } else showToast("الحد الأقصى 10 لاعبين", COLORS.warning);
        };
        document.getElementById('savePlayersBtn').onclick = ()=>{
            for(let i=0; i<gameState.players.length; i++) {
                let inp = document.getElementById(`pname_${i}`);
                if(inp && inp.value && inp.value !== gameState.players[i]) {
                    let old = gameState.players[i];
                    let newName = inp.value;
                    gameState.players[i] = newName;
                    gameState.scores[newName] = gameState.scores[old]; delete gameState.scores[old];
                    gameState.gems[newName] = gameState.gems[old]; delete gameState.gems[old];
                    gameState.votes[newName] = gameState.votes[old]; delete gameState.votes[old];
                    gameState.challengesDone[newName] = gameState.challengesDone[old]; delete gameState.challengesDone[old];
                    gameState.achievements[newName] = gameState.achievements[old]; delete gameState.achievements[old];
                    gameState.levels[newName] = gameState.levels[old]; delete gameState.levels[old];
                    gameState.xp[newName] = gameState.xp[old]; delete gameState.xp[old];
                }
            }
            saveGame();
            showToast("✅ تم حفظ التغييرات", COLORS.success);
            currentScreen="main";
            render();
        };
        document.getElementById('resetScoresBtn').onclick = ()=> confirmReset();
        document.querySelectorAll('.delPlayerBtn').forEach(btn=>{
            btn.onclick = (e)=>{
                let idx = parseInt(btn.dataset.idx);
                if(gameState.players.length>2) {
                    let removed = gameState.players[idx];
                    gameState.players.splice(idx,1);
                    delete gameState.scores[removed];
                    delete gameState.gems[removed];
                    delete gameState.votes[removed];
                    delete gameState.challengesDone[removed];
                    delete gameState.achievements[removed];
                    delete gameState.levels[removed];
                    delete gameState.xp[removed];
                    saveGame();
                    renderPlayersScreen();
                } else showToast("يجب بقاء لاعبين على الأقل", COLORS.warning);
            };
        });
    }

    // --------------------------------------------------------------
    // شاشة اللعب (مع زر الإعلان)
    // --------------------------------------------------------------
    function renderGameScreen() {
        gameState.currentTarget = gameState.players[Math.floor(Math.random()*gameState.players.length)];
        let question = getRandomQuestion();
        let cat = CATEGORIES[gameState.currentCategory];
        let sorted = [...gameState.players].sort((a,b)=> (gameState.scores[b]||0)-(gameState.scores[a]||0));
        let top3 = sorted.slice(0,3);
        let xpCur = gameState.xp[gameState.currentTarget]||0;
        let lvlCur = gameState.levels[gameState.currentTarget]||1;
        let xpPercent = (xpCur/(lvlCur*100))*100;
        let streakVal = gameState.streak[gameState.currentTarget]||0;
        let currentGems = gameState.gems[gameState.currentTarget]||0;
        let extraUnlocked = gameState.extraUnlocked[gameState.currentCategory];

        app.innerHTML = `
            <div class="animate-fade">
                <div class="flex-between">
                    <button id="quitGameBtn" style="background:none; font-size:1.3rem;">←</button>
                    <div style="background:${cat.color}20; border-radius:2rem; padding:0.3rem 1rem;">${cat.emoji} ${cat.label}</div>
                    <button id="refreshGameBtn" style="background:none;">↻</button>
                </div>
                <div class="flex-between mt-1">
                    <span class="rank-badge">💎 ${currentGems} ج</span>
                    <span class="rank-badge">✨ x${gameState.comboMult}</span>
                    <span class="rank-badge">🔥 ${streakVal}</span>
                </div>
                <div class="card text-center" style="background:${cat.color}20; margin-top:0.5rem;">
                    🎯 دورك يا <strong style="font-size:1.2rem;">${gameState.currentTarget}</strong>
                </div>
                <div class="card" style="border-color:${cat.color}; text-align:center;">
                    <div style="font-size:1.25rem; font-weight:bold; line-height:1.4;">${question}</div>
                </div>
                <div class="progress-bar mt-2"><div class="progress-fill" style="width:${xpPercent}%"></div></div>
                <div class="text-dim text-center">مستوى ${lvlCur} (${xpCur}/${lvlCur*100} XP) | 👑 الهداف: ${top3[0]||''}</div>

                <div class="text-gold mt-3">👇 شكون هو؟</div>
                <div id="voteBtnsContainer" class="flex-center" style="margin-top:0.5rem;"></div>

                <div class="flex-center mt-3">
                    <button class="action-btn" id="challengeBtn">🎭 تحدي</button>
                    <button class="action-btn" id="diceBtn">🎲 زهر</button>
                    <button class="action-btn" id="dailyBtn">🎁 يومية</button>
                </div>
                <div class="mt-2">
                    <button class="ad-btn" id="watchAdBtn" style="width:100%;">📺 شاهد إعلان (30 ث) +500 جوهرة و 20 سؤال جديد</button>
                </div>
                ${extraUnlocked ? '<div class="text-success text-center mt-1">✓ تم فتح 20 سؤال إضافي لهذه الفئة!</div>' : ''}
                <div class="text-dim text-center mt-2" style="font-size:0.7rem;">⭐ كل 5 ألعاب صندوق مجاني | 🎲 الزهر مرة يومياً</div>
            </div>
        `;

        let container = document.getElementById('voteBtnsContainer');
        for(let p of gameState.players) {
            let btn = document.createElement('button');
            btn.innerText = p;
            btn.className = 'vote-btn';
            btn.style.background = cat.color;
            btn.style.margin = '0.2rem';
            btn.onclick = ()=> voteForPlayer(p);
            container.appendChild(btn);
        }

        document.getElementById('quitGameBtn').onclick = ()=>{ currentScreen="main"; render(); };
        document.getElementById('refreshGameBtn').onclick = ()=>{ renderGameScreen(); };
        document.getElementById('challengeBtn').onclick = ()=> showChallengePopup();
        document.getElementById('diceBtn').onclick = ()=> showDiceOncePerDay();
        document.getElementById('dailyBtn').onclick = ()=> showDailyReward();
        document.getElementById('watchAdBtn').onclick = ()=> showAdAndReward();
    }

    function voteForPlayer(player) {
        let points = 10 * gameState.comboMult;
        gameState.votes[player] = (gameState.votes[player]||0)+1;
        gameState.scores[player] = (gameState.scores[player]||0)+points;
        addXP(player, Math.floor(points/2));
        if(player === gameState.lastWinner) {
            gameState.streak[player] = (gameState.streak[player]||0)+1;
            if(gameState.streak[player]>=3) gameState.comboMult=2;
            showToast(`🔥 COMBO x${gameState.comboMult}! ${player} في حالة!`, COLORS.orange);
        } else {
            gameState.streak[player] = 1;
            gameState.comboMult = 1;
            showToast(`😂 ${player} +${points} نقطة`, COLORS.success);
        }
        gameState.lastWinner = player;
        checkAchievements(player);
        saveGame();
        renderGameScreen();
    }

    // إعلان 30 ثانية يمنح 500 جوهرة ويفتح 20 سؤالاً للفئة الحالية
    function showAdAndReward() {
        if(gameState.extraUnlocked[gameState.currentCategory]) {
            showToast("✅ هذه الفئة بالفعل لديها 20 سؤالاً إضافياً!", COLORS.warning);
            return;
        }
        // إنشاء نافذة إعلان وهمي مع عداد
        let modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h3 class="text-accent">📺 إعلان</h3>
                <div id="adTimer" style="font-size:2rem; margin:0.5rem;">30</div>
                <div>شاهد الإعلان لمدة 30 ثانية</div>
                <div class="progress-bar mt-2"><div id="adProgress" class="progress-fill" style="width:0%"></div></div>
                <button id="closeAdBtn" class="btn-outline mt-2" style="display:none;">إغلاق</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        
        let timer = 30;
        const timerDiv = modalDiv.querySelector('#adTimer');
        const progressDiv = modalDiv.querySelector('#adProgress');
        const closeBtn = modalDiv.querySelector('#closeAdBtn');
        
        let interval = setInterval(() => {
            timer--;
            timerDiv.innerText = timer;
            progressDiv.style.width = ((30-timer)/30)*100 + '%';
            if(timer <= 0) {
                clearInterval(interval);
                timerDiv.innerText = "✅ تم";
                // منح المكافأة
                gameState.gems[gameState.currentTarget] = (gameState.gems[gameState.currentTarget]||0) + 500;
                if(!gameState.extraUnlocked[gameState.currentCategory]) {
                    gameState.extraUnlocked[gameState.currentCategory] = true;
                    rebuildQuestions();
                    gameState.usedQuestions[gameState.currentCategory] = []; // إعادة تعيين الأسئلة المستخدمة
                    showToast(`🎉 فتحت 20 سؤال جديد للفئة ${CATEGORIES[gameState.currentCategory].label}!`, COLORS.success);
                }
                showToast(`💎 حصلت على 500 جوهرة!`, COLORS.gold);
                saveGame();
                // إظهار زر الإغلاق
                closeBtn.style.display = 'block';
            }
        }, 1000);
        
        closeBtn.onclick = () => {
            clearInterval(interval);
            modalDiv.remove();
            renderGameScreen();
        };
    }

    function showDiceOncePerDay() {
        let today = new Date().toISOString().slice(0,10);
        if(gameState.lastDiceDate === today) {
            showToast("⏰ النرد متاح مرة واحدة في اليوم! غداً تجي.", COLORS.warning);
            return;
        }
        gameState.lastDiceDate = today;
        saveGame();

        let result = Math.floor(Math.random()*6)+1;
        let diceMap = ["⚀","⚁","⚂","⚃","⚄","⚅"];
        let points = result * 25 * gameState.comboMult;
        let special = "";
        if(result===6) { points+=100; special="🎉 +100 إضافية!"; makeConfetti(); }
        else if(result===1) { points = Math.max(10, Math.floor(points/2)); special="😅 نصف النقاط فقط"; }
        gameState.scores[gameState.currentTarget] += points;
        addXP(gameState.currentTarget, Math.floor(points/2));
        saveGame();

        let modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h3 class="text-accent">🎲 رمي النرد (مرة يومياً)</h3>
                <div style="font-size:4rem">${diceMap[result-1]}</div>
                <div style="font-size:1.8rem">النتيجة: ${result}</div>
                <div class="text-success">🎁 +${points} نقطة</div>
                <div class="text-gold">${special}</div>
                <button id="closeDiceBtn" class="btn-primary mt-2" style="width:100%">متابعة</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        document.getElementById('closeDiceBtn').onclick = ()=>{ modalDiv.remove(); renderGameScreen(); };
    }

    function showDailyReward() {
        let today = new Date().toISOString().slice(0,10);
        if(gameState.lastSpinDate === today) {
            showToast("⏰ الهدية اليومية مرة واحدة في اليوم", COLORS.warning);
            return;
        }
        let reward = SPIN_WHEEL[Math.floor(Math.random()*SPIN_WHEEL.length)];
        gameState.lastSpinDate = today;
        gameState.scores[gameState.currentTarget] += reward.points;
        saveGame();
        let modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h3 class="text-gold">🎁 هدية يومية</h3>
                <div style="font-size:2.5rem">${reward.emoji}</div>
                <div>${reward.name}</div>
                <button id="closeDailyBtn" class="btn-primary mt-2">استلام</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        document.getElementById('closeDailyBtn').onclick = ()=>{ modalDiv.remove(); renderGameScreen(); };
        makeConfetti();
    }

    function showChallengePopup() {
        let challenge = CHALLENGES[Math.floor(Math.random()*CHALLENGES.length)];
        let pts = 50 * gameState.comboMult;
        let modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h3 class="text-accent">🎭 تحدي</h3>
                <div style="margin:1rem 0">${challenge}</div>
                <div class="text-gold">⭐ المكافأة: ${pts} نقطة</div>
                <div class="flex-center mt-2">
                    <button id="completeChallengeBtn" class="btn-primary" style="width:auto; padding:0.5rem 1.2rem;">✅ تم التنفيذ</button>
                    <button id="cancelModalBtn" class="btn-outline">إلغاء</button>
                </div>
            </div>
        `;
        document.body.appendChild(modalDiv);
        document.getElementById('completeChallengeBtn').onclick = ()=>{
            gameState.challengesDone[gameState.currentTarget] = (gameState.challengesDone[gameState.currentTarget]||0)+1;
            gameState.scores[gameState.currentTarget] += pts;
            addXP(gameState.currentTarget, Math.floor(pts/2));
            saveGame();
            showToast(`🎭 ${gameState.currentTarget} +${pts} نقطة`, COLORS.success);
            modalDiv.remove();
            renderGameScreen();
        };
        document.getElementById('cancelModalBtn').onclick = ()=> modalDiv.remove();
    }

    function showSettingsMenu() {
        let modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card" style="width:320px; padding:1rem;">
                <h3 class="text-accent" style="margin-bottom:1rem;">📋 القائمة</h3>
                <div class="menu-item" id="statsItem"><span style="font-size:1.5rem;">📊</span> <span>الإحصائيات</span></div>
                <div class="menu-item" id="achievementsItem"><span style="font-size:1.5rem;">🏆</span> <span>الإنجازات</span></div>
                <div class="menu-item" id="privacyItem"><span style="font-size:1.5rem;">📜</span> <span>سياسة الخصوصية</span></div>
                <div class="menu-item" id="closeMenuItem" style="border-color:#e94560;"><span style="font-size:1.5rem;">❌</span> <span>إغلاق</span></div>
            </div>
        `;
        document.body.appendChild(modalDiv);
        document.getElementById('statsItem').onclick = ()=>{ showStatsDialog(); modalDiv.remove(); };
        document.getElementById('achievementsItem').onclick = ()=>{ showAchievementsDialog(); modalDiv.remove(); };
        document.getElementById('privacyItem').onclick = ()=>{ showPrivacyDialog(); modalDiv.remove(); };
        document.getElementById('closeMenuItem').onclick = ()=> modalDiv.remove();
    }

    function showStatsDialog() {
        let mostVoted = gameState.players.reduce((a,b)=> (gameState.votes[a]||0)>(gameState.votes[b]||0)?a:b, gameState.players[0]);
        let mostChallenges = gameState.players.reduce((a,b)=> (gameState.challengesDone[a]||0)>(gameState.challengesDone[b]||0)?a:b, gameState.players[0]);
        let totalPoints = Object.values(gameState.scores).reduce((s,v)=>s+v,0);
        let totalAch = Object.values(gameState.achievements).reduce((s,arr)=>s+arr.length,0);
        let text = `📊 إحصائيات اللعبة\n\n👥 لاعبين: ${gameState.players.length}\n🎮 ألعاب: ${gameState.totalGames}\n💰 مجموع النقاط: ${totalPoints}\n⭐ إنجازات: ${totalAch}\n✨ مضاعف: x${gameState.comboMult}\n🎯 أكثر متهم: ${mostVoted} (${gameState.votes[mostVoted]||0})\n🎭 أكثر تحديات: ${mostChallenges} (${gameState.challengesDone[mostChallenges]||0})`;
        alert(text);
    }
    function showAchievementsDialog() {
        let list = Object.values(ACHIEVEMENTS_MAP).map(a=>`${a.name}\n  └ ${a.desc} (+${a.points})`).join('\n\n');
        let playerAchieve = gameState.players.slice(0,3).map(p=>`👤 ${p}: ${gameState.achievements[p].length} إنجاز`).join('\n');
        alert(`🎯 الإنجازات المتاحة:\n${list}\n\n🏅 إنجازات اللاعبين:\n${playerAchieve}`);
    }
    function showPrivacyDialog() {
        alert("📜 سياسة الخصوصية\n• لا نجمع معلومات شخصية\n• حفظ محلي فقط\n• جميع البيانات قابلة للحذف\n• لعبة تونسية 100%");
    }
    function confirmReset() {
        if(confirm("⚠️ هل أنت متأكد من إعادة تعيين جميع النقاط؟ لا يمكن التراجع.")) {
            for(let p of gameState.players) {
                gameState.scores[p]=0;
                gameState.votes[p]=0;
                gameState.challengesDone[p]=0;
                gameState.streak[p]=0;
            }
            saveGame();
            showToast("🔄 تم إعادة تعيين النقاط", COLORS.warning);
            if(currentScreen==="players") renderPlayersScreen();
            else renderMainScreen();
        }
    }
    function makeConfetti() {
        for(let i=0;i<40;i++) {
            let conf = document.createElement('div');
            conf.style.position='fixed';
            conf.style.width=Math.random()*10+5+'px';
            conf.style.height=conf.style.width;
            conf.style.backgroundColor=`hsl(${Math.random()*360},100%,60%)`;
            conf.style.left=Math.random()*100+'%';
            conf.style.top='-20px';
            conf.style.borderRadius='50%';
            conf.style.pointerEvents='none';
            conf.style.zIndex=9999;
            conf.style.animation=`confettiPop 0.8s ease-out forwards`;
            document.body.appendChild(conf);
            setTimeout(()=>conf.remove(),800);
        }
    }

    loadGame();
    render();
</script>
</body>
</html>
