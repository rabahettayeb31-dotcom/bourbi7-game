<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>شكون أكثر واحد؟ - أونلاين + أوفلاين</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{background:#050510;color:#fff;font-family:'Tajawal',sans-serif;min-height:100vh;direction:rtl;overflow-x:hidden;}
        body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,245,255,.025)1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,.025)1px,transparent 1px);background-size:40px 40px;animation:gridMove 20s linear infinite;pointer-events:none;z-index:0;}
        @keyframes gridMove{from{background-position:0 0}to{background-position:40px 40px}}
        #root{position:relative;z-index:2;max-width:550px;width:100%;margin:0 auto;padding:1rem 0.8rem 5rem;min-height:100vh;}
        .card{background:#0d0d20;border-radius:1.2rem;padding:1rem;margin-bottom:.8rem;border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(2px);}
        .card-accent{border-color:rgba(0,245,255,.35);box-shadow:0 0 20px rgba(0,245,255,.15);}
        .card-gold{border-color:rgba(255,215,0,.4);box-shadow:0 0 20px rgba(255,215,0,.15);}
        button{font-family:'Tajawal',sans-serif;cursor:pointer;border:none;font-weight:700;transition:all 0.15s ease;}
        button:active{transform:scale(0.96);}
        .btn-primary{background:linear-gradient(135deg,#ff2d55,#c0002a);color:white;padding:.8rem 1rem;border-radius:3rem;width:100%;font-size:1rem;font-weight:900;box-shadow:0 0 15px rgba(255,45,85,.4);margin-bottom:.6rem;}
        .btn-purple{background:linear-gradient(135deg,#b040ff,#6000bb);}
        .btn-green{background:linear-gradient(135deg,#00ff87,#00cc66);color:#000;}
        .btn-ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:white;border-radius:3rem;padding:.7rem 1.2rem;}
        input{background:#0d0d20;border:1px solid rgba(255,255,255,.12);border-radius:3rem;padding:.7rem 1.2rem;color:white;font-family:'Tajawal',sans-serif;font-size:1rem;text-align:center;width:100%;outline:none;}
        .section-title{font-size:.7rem;font-weight:900;color:#aaa;letter-spacing:.1em;margin-bottom:.6rem;}
        .player-row{display:flex;align-items:center;gap:.7rem;padding:.5rem 0;border-bottom:1px solid rgba(255,255,255,.05);}
        .vote-grid{display:flex;flex-direction:column;gap:.5rem;margin-top:.7rem;}
        .vote-btn{background:linear-gradient(135deg,#2c3e66,#1a2340);padding:.8rem;border-radius:1rem;font-weight:900;font-size:1rem;display:flex;justify-content:space-between;align-items:center;color:white;}
        .q-box{background:linear-gradient(135deg,#0d0d25,#150d20);border:1px solid rgba(0,245,255,.3);border-radius:1.5rem;padding:1.2rem;text-align:center;margin-bottom:1rem;font-weight:bold;}
        .badge{display:inline-block;border-radius:2rem;padding:.2rem .6rem;font-size:.7rem;background:#2c1a4d;color:#ffd700;}
        .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem;}
        .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;}
        .cat-btn{background:#12122a;border-radius:1rem;padding:.6rem;text-align:center;font-weight:bold;transition:.1s;cursor:pointer;}
        .flex-between{display:flex;justify-content:space-between;align-items:center;}
        .winner-animation{animation:fadePop .35s cubic-bezier(0.34,1.2,0.64,1);}
        @keyframes fadePop{from{transform:scale(0.9);opacity:0;}to{transform:scale(1);opacity:1;}}
        .mode-toggle{display:flex;gap:.5rem;margin-bottom:1rem;}
        .mode-btn{flex:1;padding:.5rem;border-radius:2rem;background:#12122a;border:1px solid rgba(255,255,255,.2);color:white;font-weight:bold;cursor:pointer;}
        .mode-btn.active{background:linear-gradient(135deg,#ff2d55,#c0002a);border:none;}
        .text-gold{color:#ffd700;}
        .text-cyan{color:#00f5ff;}
        .code-big{font-size:2rem;letter-spacing:0.2em;font-weight:900;background:#00000055;border-radius:1rem;padding:.3rem;text-align:center;margin:.5rem 0;}
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    // ------------------------ DONNÉES CENTRALES + CATÉGORIES + SYSTÈME DE 20 QUESTIONS SUP ------------------------
    const CATEGORIES = {
        friends: { emoji: "👬", label: "الصحاب", color: "#f39c12", grad: "linear-gradient(135deg,#f39c12,#e67e22)" },
        family: { emoji: "👨‍👩‍👧‍👦", label: "العايلة", color: "#2ecc71", grad: "linear-gradient(135deg,#2ecc71,#27ae60)" },
        couples: { emoji: "💑", label: "الكوبل", color: "#e84393", grad: "linear-gradient(135deg,#e84393,#c0392b)" },
        lovers: { emoji: "💕", label: "الحبايب", color: "#9b59b6", grad: "linear-gradient(135deg,#9b59b6,#6c3483)" },
        work: { emoji: "💼", label: "العمل", color: "#3498db", grad: "linear-gradient(135deg,#3498db,#2980b9)" },
        ramadan: { emoji: "🌙", label: "رمضان", color: "#1abc9c", grad: "linear-gradient(135deg,#1abc9c,#16a085)" },
        eid: { emoji: "🎉", label: "العيد", color: "#e67e22", grad: "linear-gradient(135deg,#e67e22,#d35400)" },
        bac: { emoji: "🎓", label: "باكالوريا", color: "#8e44ad", grad: "linear-gradient(135deg,#8e44ad,#6c3483)" },
        spicy: { emoji: "🔥", label: "جريء 🔞", color: "#e74c3c", grad: "linear-gradient(135deg,#e74c3c,#c0392b)" },
        general: { emoji: "📚", label: "ثقافة عامة", color: "#1abc9c", grad: "linear-gradient(135deg,#1abc9c,#16a085)" }
    };
    const CAT_KEYS = ["friends","family","couples","lovers","work","ramadan","eid","bac","spicy","general"];

    // Questions de base + culture générale (5 questions)
    const BASE_QUESTIONS = {
        friends: ["شكون أكثر واحد يڨول 'أنا جاي' وهو مازال في الدار؟ 😂","شكون أكثر واحد يصرف فلوسو في القهوة؟ ☕","شكون اللي يضحك وحدو؟ 😅","شكون اللي يكذب أكثر في المجموعة؟ 🤥","شكون اللي دايمن يتأخر؟ ⏰","شكون اللي ياكل ماكلة الغير بدون ما يطلب؟ 🍕","شكون اللي عندو أكثر تصاور غريبة في التليفون؟ 📸","شكون اللي يكون أول واحد يخرج من كوه لانتا؟ 🏝️","شكون اللي يقعد أطول وقت في الحمام؟ 🚽","شكون اللي يكون أسوء سواق في المجموعة؟ 🚗"],
        family: ["شكون أكثر واحد يسرق من الثلاجة بالليل؟ 😂","شكون اللي دايمن يسبّت الضو وقت يخرج؟ 💡","شكون اللي يستعمل كل الماء الساخن في الدوش؟ 🚿","شكون اللي أصعب واحد يفيق في الصباح؟ ⏰","شكون اللي يكثر يغفى في الكنبة؟ 🛋️","شكون اللي ما يرتبش في غرفتو؟ 🛏️","شكون اللي مدمن أكثر على تليفونو وقت المايدة؟ 📵","شكون اللي يكثر يتخانق على التلفار؟ 📺","شكون اللي لازم دايمن يكون آخر كلمة؟ 💬","شكون اللي عندو أحرج تصاور من الطفولة؟ 👶"],
        couples: ["شكون اللي يأخذ أكثر مكان في القاعدة؟ 🛏️","شكون اللي دايمن يختار الرستوران؟ 🍽️","شكون اللي ينسى أعياد الميلاد؟ 📅","شكون اللي يأخذ أطول وقت باش يجهز روحو؟ 💆","شكون اللي يصرف أكثر فلوس بلا فايدة؟ 💸","شكون اللي دايمن عندو الحق في الخناقات؟ 🤔","شكون اللي أرومانسي أكثر في الحياة اليومية؟ 💕","شكون اللي يكثر يزعل بصمت؟ 😤","شكون اللي أكثر واحد متردد في اختيار فلم؟ 🎥","شكون اللي يكثر يتذكر خناقة صارت قبل 3 سنين؟ 🧠"],
        lovers: ["شكون أكثر واحد يعمل flirt؟ 😏","شكون أرومانسي أكثر فيكم الاثنين؟ 💑","شكون اللي يبعت أكثر رسايل حبّ؟ 💌","شكون اللي أعجب بالتاني أول مرة؟ ⚡","شكون اللي يقول 'نحبك' أول واحد في الصباح؟ 🌅","شكون اللي يحفظ أكثر هدايا وتفاصيل صغيرة؟ 🎀","شكون اللي يكثر يبكي وقت العرس؟ 💒","شكون أكثر واحد متحمس لأعياد الميلاد؟ 🎂","شكون اللي يكثر يختار الأغاني في السيارة؟ 🎵","شكون اللي أرومانسي أكثر وقت السفر؟ 🌍"],
        work: ["شكون أكثر واحد يتأخر كل نهار؟ ⏰","شكون أكثر واحد يشرب قهوة أكثر من المطلوب؟ ☕","شكون اللي يكثر ياخذ بريك؟ 🚬","شكون اللي ينام في المكتب وقت المدير ماكش؟ 😴","شكون اللي يتغيب أكثر بحجة المرض؟ 🤒","شكون اللي دايمن ياخذ كريدي على خدمة غيرو؟ 🎭","شكون اللي يكثر يمدح روحو قدام الرئيس؟ 🗣️","شكون اللي يكثر يعمل روحو مشغول باش ما يساعدش؟ 🙈","شكون اللي دايمن يكتب إيميلات طويلة بلا معنى؟ ✉️","شكون اللي يكثر ينسى يرد على الإيميلات؟ 📧"],
        ramadan: ["شكون أكثر واحد ياكل في السحور؟ 🌙","شكون أكثر واحد ينعس بعد الفطور؟ 😴","شكون اللي دايمن ينسى يصوم أول يوم؟ 🤭","شكون اللي يكثر يتفرج في المسلسلات التركية؟ 📺","شكون اللي دايمن يشرب الماء قدام الصايمين؟ 🚰","شكون اللي يكثر يقول 'نعمل رياضة بعد الفطار' ويموت على الكنبة؟ 🛋️","شكون اللي يكثر يصور الأكل وينزله على الأنستغرام؟ 📸","شكون اللي دايمن يزيد في الحلويات؟ 🍰","شكون اللي يكثر ياكل بجعة باش يعوض النهار؟ 🐪","شكون اللي دايمن يتقهو بعد الفطار ويسهر؟ ☕"],
        eid: ["شكون أكثر واحد يحب لبسة العيد؟ 👗","شكون أكثر واحد يطلب العيدية؟ 💰","شكون اللي دايمن ينسى يعطيك العيدية؟ 😅","شكون اللي يصرف العيدية في نفس النهار؟ 💸","شكون اللي أكثر واحد يزور العائلة كلها في نهار واحد؟ 🏃‍♂️","شكون اللي يكثر يجيب هدايا غالية باش يبان كريم؟ 🎁","شكون اللي دايمن يروح للمسجد ويرقد؟ 😴","شكون اللي دايمن يسرق العيدية من الصغار؟ 😈","شكون اللي يكثر يحضر حلويات وياكل قبل الضيوف؟ 🍰","شكون اللي دايمن يخاف من الذبايح؟ 😨"],
        bac: ["شكون أكثر واحد يخاف من الباك؟ 😰","شكون أكثر واحد يراجع آخر ليلة؟ 📚","شكون اللي يكثر يقول 'باش نبدا من غدوة' وما يبداش؟ ⏳","شكون اللي دايمن يطلب الحظ أكثر من المراجعة؟ 🍀","شكون اللي دايمن يتفائل ب 'ربّي يسهل' ويرقد؟ 😴","شكون اللي يكثر يحفظ في آخر ساعة وينسى كل شيء؟ 😵","شكون اللي دايمن يخاف من مادة الفلسفة؟ 🤯","شكون اللي دايمن يلوم على الأستاذ وقت ما ينجحش؟ 👨‍🏫","شكون اللي يكثر يكتب دعاء على الورقة؟ 📝","شكون اللي دايمن يخرج من قاعة الباك باكي؟ 😭"],
        spicy: ["شكون أكثر واحد عنده خبرة؟ 🔥","شكون اللي يكثر يخطط للقاءات سرية؟ 🤫","شكون اللي دايمن يدي المبادرة؟ 👑","شكون اللي يكثر يفتح المواضيع الساخنة؟ 🗣️","شكون اللي دايمن يموت على القبل؟ 😘","شكون اللي يكثر يكتب رسائل جريئة؟ 💌","شكون اللي دايمن يخبي هاتفو؟ 📱","شكون اللي يكثر يعمل سوربرايز ليلي؟ 🌙","شكون اللي دايمن يستعمل الكلام الموحي؟ 😏","شكون اللي يكثر يستعمل العطور المثيرة؟ 🌹"],
        general: ["🏛️ ما هي عاصمة تونس؟", "🌍 من هو مؤسس الدولة السعودية الحديثة؟", "📖 من هو مؤلف كتاب 'المقدمة'؟", "🏆 من فاز بكأس العالم 2018؟", "🌊 ما هو أكبر محيط في العالم؟"]
    };

    // Stockage des questions bonus débloquées par vidéo (20 par catégorie)
    let extraQuestionsMap = {};
    CAT_KEYS.forEach(k => { extraQuestionsMap[k] = []; });
    function loadBonusStorage() { try { const s = localStorage.getItem('chkoun_bonus'); if(s) { const d=JSON.parse(s); for(let k of CAT_KEYS) if(d[k]) extraQuestionsMap[k]=d[k]; } } catch(e){} }
    function saveBonusStorage() { localStorage.setItem('chkoun_bonus', JSON.stringify(extraQuestionsMap)); }
    loadBonusStorage();
    function getFullQuestions(cat) { return [...(BASE_QUESTIONS[cat]||BASE_QUESTIONS.general), ...(extraQuestionsMap[cat]||[])]; }
    function addTwentyQuestions(cat) {
        if(!extraQuestionsMap[cat]) extraQuestionsMap[cat]=[];
        for(let i=1;i<=20;i++) extraQuestionsMap[cat].push(`🎁 [بونص فيديو] سؤال ${i} في ${CATEGORIES[cat]?.label}: شكون أكثر واحد يقدر يحل هاللغز؟`);
        saveBonusStorage();
    }

    // ----------------------- STOCKAGE POUR MODE ONLINE (localStorage) ------------------------
    const storage = {
        async get(key) { return JSON.parse(localStorage.getItem(key)); },
        async set(key, val) { localStorage.setItem(key, JSON.stringify(val)); },
        async delete(key) { localStorage.removeItem(key); }
    };
    function genCode() {
        // generate UPPERCASE 5 chars alphanumeric
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let c = '';
        for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
        return c;
    }
    function genId() { return Date.now()+'-'+Math.random(); }

    // Fonction pour piocher une question sans répétition
    function pickQuestionForCategory(cat, usedMap) {
        const full = getFullQuestions(cat);
        const usedSet = new Set(usedMap[cat]||[]);
        let avail = full.map((q,i)=>({q,i})).filter(it=>!usedSet.has(it.i));
        if(avail.length===0){
            usedMap[cat]=[];
            avail = full.map((q,i)=>({q,i}));
        }
        const pick = avail[Math.floor(Math.random()*avail.length)];
        const newUsed = {...usedMap, [cat]: [...(usedMap[cat]||[]), pick.i]};
        return { text: pick.q, usedMap: newUsed };
    }

    // ----------------------- COMPOSANT PRINCIPAL AVEC DOUBLE MODE ------------------------
    const { useState, useEffect } = React;

    function App() {
        const [mode, setMode] = useState('online'); // 'online' ou 'offline'
        // --- Online state
        const [onlineScreen, setOnlineScreen] = useState('landing');
        const [onlineRoom, setOnlineRoom] = useState(null);
        const [myId] = useState(()=>{let i=sessionStorage.getItem('cq_id'); if(!i){i=genId(); sessionStorage.setItem('cq_id',i);} return i;});
        const [nameInput, setNameInput] = useState(sessionStorage.getItem('cq_name')||'');
        const [codeInput, setCodeInput] = useState('');
        const [onlineLoading, setOnlineLoading] = useState(false);
        const [onlineError, setOnlineError] = useState('');
        // --- Offline state
        const [offlinePlayers, setOfflinePlayers] = useState([]);
        const [offlineTempName, setOfflineTempName] = useState('');
        const [offlineGame, setOfflineGame] = useState({ status: 'lobby', category: 'friends', round:1, usedIdx:{}, currentQuestion:null, votes:{}, votersDone:[], voterIndex:0, comboMult:1, lastWinnerId:null, roundResult:null });
        const [offlineMessage, setOfflineMessage] = useState('');
        const [showCatModalOff, setShowCatModalOff] = useState(false);
        
        // =================== MODE ONLINE ===================
        async function createRoom(){
            if(!nameInput.trim()){setOnlineError('اكتب اسمك أولاً');return;}
            setOnlineLoading(true);
            const code = genCode(); // uppercase now
            const room = {
                code, hostId: myId, players: [{id:myId, name:nameInput.trim(), score:0}], status:'waiting', category:'friends',
                usedQIdx:{}, round:0, votes:{}, hasVoted:[], voterIndex:0, roundWinner:null, comboMult:1, lastWinnerId:null
            };
            await storage.set(`room_${code}`, room);
            setOnlineRoom(room);
            sessionStorage.setItem('cq_room', code);
            setOnlineScreen('waiting');
            setOnlineLoading(false);
        }
        async function joinRoom(){
            if(!nameInput.trim() || !codeInput.trim()){setOnlineError('املأ الاسم والكود');return;}
            setOnlineLoading(true);
            const codeUp = codeInput.trim().toUpperCase();
            const room = await storage.get(`room_${codeUp}`);
            if(!room){setOnlineError('❌ ما لقيناش الغرفة! تأكد من الكود'); setOnlineLoading(false); return;}
            if(room.players.length>=10){setOnlineError('الغرفة ممتلئة (10/10)'); setOnlineLoading(false); return;}
            if(!room.players.find(p=>p.id===myId)) room.players.push({id:myId, name:nameInput.trim(), score:0});
            await storage.set(`room_${room.code}`, room);
            setOnlineRoom(room);
            sessionStorage.setItem('cq_room', room.code);
            setOnlineScreen('waiting');
            setOnlineLoading(false);
        }
        async function startOnlineGame(){
            const r = await storage.get(`room_${onlineRoom.code}`);
            if(!r || r.players.length<2) return;
            const qData = pickQuestionForCategory(r.category, r.usedQIdx || {});
            const newRoom = {...r, status:'playing', currentQuestion:qData.text, usedQIdx:qData.usedMap, round: r.round+1, votes:{}, hasVoted:[], voterIndex:0, roundWinner:null};
            await storage.set(`room_${r.code}`, newRoom);
            setOnlineRoom(newRoom);
            setOnlineScreen('playing');
        }
        async function castOnlineVote(targetId){
            const r = await storage.get(`room_${onlineRoom.code}`);
            if(!r || r.status!=='playing') return;
            const currentVoter = r.players[r.voterIndex];
            if(!currentVoter || r.hasVoted.includes(currentVoter.id)) return;
            const newVotes = {...r.votes, [targetId]: [...(r.votes[targetId]||[]), currentVoter.id]};
            const newHasVoted = [...r.hasVoted, currentVoter.id];
            const newIndex = r.voterIndex+1;
            if(newIndex >= r.players.length){
                // calcul résultats
                const counts={}; for(let [tid,arr] of Object.entries(newVotes)) counts[tid]=arr.length;
                let winnerId=null, max=0; for(let [pid,c] of Object.entries(counts)) if(c>max){max=c; winnerId=pid;}
                let newCombo = (winnerId===r.lastWinnerId) ? Math.min(4, r.comboMult+1) : 1;
                let updatedPlayers = r.players.map(p=>{
                    let pts=0;
                    if(p.id===winnerId) pts += 10 * (counts[p.id]||0) * newCombo;
                    if((newVotes[winnerId]||[]).includes(p.id) && p.id!==winnerId) pts+=5*newCombo;
                    return {...p, score: p.score+pts};
                });
                const finalRoom = {...r, players:updatedPlayers, status:'roundEnd', roundWinner:{winnerId, winnerName: updatedPlayers.find(p=>p.id===winnerId)?.name, voteCount:max, counts}, comboMult:newCombo, lastWinnerId:winnerId, votes:{}, hasVoted:[], voterIndex:0};
                await storage.set(`room_${r.code}`, finalRoom);
                setOnlineRoom(finalRoom);
                setOnlineScreen('roundEnd');
            } else {
                const updated = {...r, votes:newVotes, hasVoted:newHasVoted, voterIndex:newIndex};
                await storage.set(`room_${r.code}`, updated);
                setOnlineRoom(updated);
            }
        }
        async function nextOnlineRound(){
            const r = await storage.get(`room_${onlineRoom.code}`);
            const qData = pickQuestionForCategory(r.category, r.usedQIdx);
            const newRoom = {...r, status:'playing', currentQuestion:qData.text, usedQIdx:qData.usedMap, round: r.round+1, votes:{}, hasVoted:[], voterIndex:0, roundWinner:null};
            await storage.set(`room_${r.code}`, newRoom);
            setOnlineRoom(newRoom);
            setOnlineScreen('playing');
        }
        async function changeCatOnline(cat){
            const r = await storage.get(`room_${onlineRoom.code}`);
            if(r){ r.category=cat; r.usedQIdx={}; await storage.set(`room_${r.code}`, r); setOnlineRoom(r);}
        }
        async function leaveRoom(){
            if(onlineRoom){
                const r = await storage.get(`room_${onlineRoom.code}`);
                if(r){
                    r.players = r.players.filter(p=>p.id!==myId);
                    if(r.players.length===0) await storage.delete(`room_${onlineRoom.code}`);
                    else await storage.set(`room_${r.code}`, r);
                }
            }
            sessionStorage.removeItem('cq_room');
            setOnlineScreen('landing');
            setOnlineRoom(null);
        }
        // polling online
        useEffect(()=>{
            if(mode==='online' && onlineRoom && onlineRoom.code){
                const interval = setInterval(async()=>{
                    const r = await storage.get(`room_${onlineRoom.code}`);
                    if(r) setOnlineRoom(r);
                },1800);
                return ()=>clearInterval(interval);
            }
        },[mode, onlineRoom?.code]);

        // =================== MODE OFFLINE ===================
        const addOfflinePlayer = () => {
            if(!offlineTempName.trim()) return;
            if(offlinePlayers.length>=10){setOfflineMessage("الحد الأقصى 10"); return;}
            setOfflinePlayers([...offlinePlayers, {id:Date.now()+Math.random(), name:offlineTempName.trim(), score:0}]);
            setOfflineTempName("");
        };
        const removeOfflinePlayer = (id) => setOfflinePlayers(offlinePlayers.filter(p=>p.id!==id));
        const startOfflineGame = () => {
            if(offlinePlayers.length<2){setOfflineMessage("يلزم 2 لاعبين على الأقل"); return;}
            const qd = pickQuestionForCategory(offlineGame.category, offlineGame.usedIdx);
            setOfflineGame({ ...offlineGame, status:'voting', currentQuestion:qd.text, usedIdx:qd.usedMap, round:1, votes:{}, votersDone:[], voterIndex:0, roundResult:null, comboMult:1, lastWinnerId:null });
        };
        const castOfflineVote = (targetId) => {
            if(offlineGame.status !== 'voting') return;
            const currentVoter = offlinePlayers[offlineGame.voterIndex];
            if(!currentVoter) return;
            const newVotes = {...offlineGame.votes, [targetId]: [...(offlineGame.votes[targetId]||[]), currentVoter.id]};
            const newDone = [...offlineGame.votersDone, currentVoter.id];
            const nextIdx = offlineGame.voterIndex+1;
            if(nextIdx >= offlinePlayers.length){
                const counts={}; for(let [tid,arr] of Object.entries(newVotes)) counts[tid]=arr.length;
                let winnerId=null, max=0; for(let [pid,c] of Object.entries(counts)) if(c>max){max=c; winnerId=pid;}
                let newCombo = (winnerId===offlineGame.lastWinnerId) ? Math.min(4, offlineGame.comboMult+1) : 1;
                let updatedPlayers = offlinePlayers.map(p=>{
                    let pts=0;
                    if(p.id===winnerId) pts += 10 * (counts[p.id]||0) * newCombo;
                    if((newVotes[winnerId]||[]).includes(p.id) && p.id!==winnerId) pts+=5*newCombo;
                    return {...p, score: p.score+pts};
                });
                setOfflinePlayers(updatedPlayers);
                setOfflineGame({...offlineGame, status:'roundResult', roundResult:{winnerId, winnerName: updatedPlayers.find(p=>p.id===winnerId)?.name, voteCount:max, counts}, comboMult:newCombo, lastWinnerId:winnerId, votes:{}, votersDone:[], voterIndex:0});
            } else {
                setOfflineGame({...offlineGame, votes:newVotes, votersDone:newDone, voterIndex:nextIdx});
            }
        };
        const nextOfflineRound = () => {
            const qd = pickQuestionForCategory(offlineGame.category, offlineGame.usedIdx);
            setOfflineGame({ ...offlineGame, status:'voting', currentQuestion:qd.text, usedIdx:qd.usedMap, round: offlineGame.round+1, votes:{}, votersDone:[], voterIndex:0, roundResult:null });
        };
        const resetOffline = () => { setOfflinePlayers([]); setOfflineGame({ status:'lobby', category:'friends', round:1, usedIdx:{}, currentQuestion:null, votes:{}, votersDone:[], voterIndex:0, comboMult:1, lastWinnerId:null, roundResult:null }); setMode('online'); };
        const changeCatOffline = (cat) => { setOfflineGame({...offlineGame, category:cat, usedIdx:{}}); setShowCatModalOff(false); };
        const watchVideoOffline = (cat) => { addTwentyQuestions(cat); setOfflineMessage("✅ 20 سؤال جديد تمت إضافتهم!"); setTimeout(()=>setOfflineMessage(''),2000); };

        // Rendu selon mode
        if(mode === 'online'){
            if(onlineScreen === 'landing') return (
                <div id="root"><div className="mode-toggle"><button className={`mode-btn ${mode==='online'?'active':''}`} onClick={()=>setMode('online')}>🕹️ وضع الأونلاين</button><button className={`mode-btn`} onClick={()=>setMode('offline')}>📱 وضع الأوفلاين (جهاز واحد)</button></div>
                <div className="card"><div className="section-title">اسمك في اللعبة</div><input placeholder="اكتب اسمك" value={nameInput} onChange={e=>setNameInput(e.target.value)} style={{marginBottom:'.8rem'}}/><button className="btn-primary" onClick={createRoom} disabled={onlineLoading}>🏠 إنشاء غرفة جديدة</button><button className="btn-ghost" onClick={()=>setOnlineScreen('join')}>🔑 انضم لغرفة موجودة</button>{onlineError&&<div className="text-gold" style={{marginTop:'.5rem'}}>{onlineError}</div>}</div><div className="card"><div className="section-title">🎯 كيفاش تلعب</div><p>• واحد يعمل غرفة ويشارك الكود<br/>• الكل يدخل الكود من تليفوناتهم<br/>• السؤال يظهر والدور يلف بين اللاعبين للتصويت<br/>• اللي يجمع أكبر عدد أصوات يكسب نقاط ومضاعفات!</p></div></div>
            );
            if(onlineScreen === 'join') return (<div id="root"><div className="mode-toggle"><button className={`mode-btn ${mode==='online'?'active':''}`} onClick={()=>setMode('online')}>🕹️ أونلاين</button><button className={`mode-btn`} onClick={()=>setMode('offline')}>📱 أوفلاين</button></div><div className="card"><div className="section-title">🔐 كود الغرفة</div><input placeholder="مثال: ABC12" value={codeInput} onChange={e=>setCodeInput(e.target.value.toUpperCase())} style={{marginBottom:'.8rem'}}/><button className="btn-primary btn-purple" onClick={joinRoom} disabled={onlineLoading}>🚀 انضم</button><button className="btn-ghost" onClick={()=>setOnlineScreen('landing')}>← رجوع</button>{onlineError&&<div className="text-gold">{onlineError}</div>}</div></div>);
            if(onlineScreen === 'waiting' && onlineRoom) return (
                <div id="root"><div className="flex-between"><div className="logo">🎮 غرفة الانتظار</div><button className="btn-ghost" onClick={leaveRoom}>خروج</button></div>
                <div className="card card-accent"><div className="section-title">📢 كود الغرفة (شاركه مع الأصحاب)</div><div className="code-big">{onlineRoom.code}</div><button className="btn-ghost" onClick={()=>{navigator.clipboard.writeText(onlineRoom.code); alert("تم نسخ الكود");}}>📋 نسخ الكود</button></div>
                <div className="card"><div className="section-title">اللاعبون ({onlineRoom.players.length}/10)</div>{onlineRoom.players.map(p=><div key={p.id} className="player-row"><span>{p.name} {p.id===onlineRoom.hostId && '👑'}</span></div>)}</div>
                {onlineRoom.hostId===myId && <button className="btn-primary btn-green" onClick={startOnlineGame} disabled={onlineRoom.players.length<2}>🎲 ابدأ اللعبة ({onlineRoom.players.length} لاعبين)</button>}
                {onlineRoom.hostId!==myId && <div className="card" style={{textAlign:'center'}}>⏳ ننتظر الكابتن يبدأ...</div>}
                </div>
            );
            if(onlineScreen === 'playing' && onlineRoom) {
                const currentVoter = onlineRoom.players[onlineRoom.voterIndex];
                const alreadyVoted = onlineRoom.hasVoted.includes(currentVoter?.id);
                return (<div id="root"><div className="q-box">{onlineRoom.currentQuestion}</div><div className="card"><div className="section-title">🎤 دور {currentVoter?.name} يصوت:</div><div className="vote-grid">{onlineRoom.players.map(p=><button key={p.id} className="vote-btn" onClick={()=>castOnlineVote(p.id)} disabled={alreadyVoted}>{p.name} <span className="badge">{onlineRoom.votes?.[p.id]?.length||0}</span></button>)}</div></div></div>);
            }
            if(onlineScreen === 'roundEnd' && onlineRoom) return (<div id="root"><div className="winner-animation card"><div>🏆 {onlineRoom.roundWinner?.winnerName} حصل على {onlineRoom.roundWinner?.voteCount} صوت!</div><div>مضاعف x{onlineRoom.comboMult}</div></div><button className="btn-primary" onClick={nextOnlineRound}>⏩ الجولة التالية</button><button className="btn-ghost" onClick={()=>setOnlineScreen('landing')}>إنهاء اللعبة</button></div>);
            return <div className="card">جاري التحميل...</div>;
        } else {
            // MODE OFFLINE
            if(offlineGame.status === 'lobby') return (
                <div id="root"><div className="mode-toggle"><button className={`mode-btn`} onClick={()=>setMode('online')}>🕹️ أونلاين</button><button className={`mode-btn active`} onClick={()=>setMode('offline')}>📱 أوفلاين (نفس الجهاز)</button></div>
                <div className="card"><div className="section-title">➕ إضافة لاعبين (2 إلى 10)</div><div className="flex-between"><input placeholder="الاسم" value={offlineTempName} onChange={e=>setOfflineTempName(e.target.value)} style={{flex:2,marginLeft:'0.5rem'}}/><button className="btn-primary" style={{width:'auto',padding:'0.6rem'}} onClick={addOfflinePlayer}>إضافة</button></div>{offlineMessage&&<div className="text-gold">{offlineMessage}</div>}</div>
                <div className="card">{offlinePlayers.map(p=><div key={p.id} className="flex-between"><span>{p.name}</span><button onClick={()=>removeOfflinePlayer(p.id)} style={{background:'none',color:'#ff2d55'}}><i className="fas fa-trash-alt"></i></button></div>)}</div>
                <div className="card"><div className="section-title">🗂️ الفئة: {CATEGORIES[offlineGame.category].emoji} {CATEGORIES[offlineGame.category].label}</div><div className="flex-between" style={{gap:'0.5rem'}}><button className="btn-ghost" onClick={()=>setShowCatModalOff(true)}>تغيير الفئة</button><button className="btn-ghost" onClick={()=>watchVideoOffline(offlineGame.category)}>🎥 فيديو +20 سؤال</button></div></div>
                <button className="btn-primary btn-green" onClick={startOfflineGame} disabled={offlinePlayers.length<2}>🚀 ابدأ اللعبة (أوفلاين)</button>
                {showCatModalOff && <div className="modal" onClick={()=>setShowCatModalOff(false)}><div className="modal-box card"><div className="cat-grid">{CAT_KEYS.map(k=><div key={k} className="cat-btn" style={{background:CATEGORIES[k].color+'20', border:'1px solid '+CATEGORIES[k].color}} onClick={()=>changeCatOffline(k)}>{CATEGORIES[k].emoji} {CATEGORIES[k].label}</div>)}</div><button className="btn-ghost" style={{marginTop:'1rem'}} onClick={()=>setShowCatModalOff(false)}>إلغاء</button></div></div>}
                </div>
            );
            if(offlineGame.status === 'voting') {
                const currentName = offlinePlayers[offlineGame.voterIndex]?.name;
                return (<div id="root"><div className="q-box">{offlineGame.currentQuestion}</div><div className="card"><div className="section-title">🎤 دور {currentName} يصوت على:</div><div className="vote-grid">{offlinePlayers.map(p=><button key={p.id} className="vote-btn" onClick={()=>castOfflineVote(p.id)}>{p.name} <span>{offlineGame.votes?.[p.id]?.length||0}</span></button>)}</div></div></div>);
            }
            if(offlineGame.status === 'roundResult') {
                return (<div id="root"><div className="winner-animation card"><div>🏆 {offlineGame.roundResult?.winnerName} استلم {offlineGame.roundResult?.voteCount} صوت!</div><div>مضاعف x{offlineGame.comboMult}</div></div><button className="btn-primary" onClick={nextOfflineRound}>الجولة التالية</button><button className="btn-ghost" onClick={resetOffline}>الرئيسية</button></div>);
            }
            return <div>تحميل...</div>;
        }
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
